<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hypothesis Log — H001–H185</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;
      --green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;
      --purple:#bc8cff;--orange:#f0883e;--gray:#6e7681;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5;}

    /* Header */
    .header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
    .header-title{font-size:15px;font-weight:600;letter-spacing:.3px;}
    .header-meta{color:var(--muted);font-size:12px;}
    .back-link{color:var(--blue);text-decoration:none;font-size:12px;}
    .back-link:hover{text-decoration:underline;}

    /* Filter bar */
    .filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;align-items:stretch;overflow-x:auto;position:sticky;top:45px;z-index:19;}
    .filter-tab{padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s;user-select:none;white-space:nowrap;display:flex;align-items:center;gap:6px;}
    .filter-tab:hover{color:var(--text);}
    .filter-tab.active{color:var(--text);border-bottom-color:var(--blue);}
    .tab-count{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:1px 6px;color:var(--muted);}
    .filter-tab.active .tab-count{background:var(--blue);color:#000;border-color:var(--blue);}

    /* Search + sort bar */
    .toolbar{padding:12px 20px;display:flex;gap:10px;align-items:center;background:var(--bg);border-bottom:1px solid var(--border);}
    .search-input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:12px;width:260px;outline:none;}
    .search-input:focus{border-color:var(--blue);}
    .search-input::placeholder{color:var(--muted);}
    .sort-label{font-size:11px;color:var(--muted);}
    .sort-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:12px;cursor:pointer;}
    .result-count{font-size:11px;color:var(--muted);margin-left:auto;}

    /* Table */
    .main{padding:0 20px 24px;max-width:1300px;margin:0 auto;}
    .table-wrap{overflow-x:auto;margin-top:12px;}
    table{width:100%;border-collapse:collapse;}
    th{background:var(--surface);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:88px;}
    th:hover{color:var(--text);}
    th .sort-indicator{margin-left:4px;opacity:.4;}
    th.sorted .sort-indicator{opacity:1;color:var(--blue);}
    td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
    tr:last-child td{border-bottom:none;}
    tr.data-row:hover td{background:var(--surface2);}
    tr.data-row{cursor:pointer;transition:background .1s;}

    /* Status badge */
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
    .badge-CONFIRMED{background:rgba(63,185,80,.18);color:var(--green);border:1px solid rgba(63,185,80,.3);}
    .badge-PARTIAL{background:rgba(210,153,34,.18);color:var(--yellow);border:1px solid rgba(210,153,34,.3);}
    .badge-NOT_CONFIRMED{background:rgba(248,81,73,.18);color:var(--red);border:1px solid rgba(248,81,73,.3);}
    .badge-QUEUED{background:rgba(88,166,255,.18);color:var(--blue);border:1px solid rgba(88,166,255,.3);}
    .badge-FLAGGED,.badge-BLOCKED{background:rgba(240,136,62,.18);color:var(--orange);border:1px solid rgba(240,136,62,.3);}
    .badge-DEFERRED{background:rgba(110,118,129,.18);color:var(--gray);border:1px solid rgba(110,118,129,.3);}

    .h-num{font-family:monospace;font-size:12px;font-weight:600;color:var(--blue);}
    .metric{font-family:monospace;font-size:12px;}
    .metric.good{color:var(--green);}
    .metric.bad{color:var(--red);}
    .metric.neutral{color:var(--muted);}
    .summary-text{font-size:12px;color:var(--text);max-width:500px;}
    .no-data{color:var(--muted);font-size:11px;}

    /* Expand row */
    tr.expand-row td{padding:0;}
    .expand-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px 12px 52px;font-size:12px;color:var(--muted);line-height:1.6;animation:fadeIn .15s ease;}
    .expand-panel .full-text{color:var(--text);white-space:pre-wrap;word-break:break-word;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

    /* Empty state */
    .empty-state{padding:48px;text-align:center;color:var(--muted);}
  </style>
</head>

in existing pipeline. Stub: backtesting/daily/h184_pead_press_release_nlp.py."},{"h":181,"hstr":"H181","status":"CONFIRMED","sharpe":"1.138","cagr":"30.3%","maxdd":"-24.3%","cumul":null,"summary":"Industry-Adjusted Short-Term Reversal","full":"CONFIRMED (2026-05-08) — Industry-Adjusted Short-Term Reversal. SSRN:6630998 (Stosik & Zaremba): claimed 0.53%/month globally, Sharpe 0.74. Universe: 30 large-cap S&P 500 stocks (same as H163/H174 PEAD universe), 8 GICS sectors. Signal: REV^IN_i = R_i(t) − R̄_industry(t), where R̄_industry = equal-weight avg return of same-sector peers. Portfolio: long bottom quintile (n=6 most negative industry-adjusted reversal = strongest mean-reversion candidates). Monthly rebalance, equal-weight. IS 2013–2020: cumul=8.29× CAGR=30.3% Sharpe=1.381 MaxDD=-24.3% NegYrs=0. OOS 2021–2026: cumul=3.23× CAGR=24.6% Sharpe=1.138 MaxDD=-18.4% NegYrs=1. SPY OOS: cumul=2.04× Sharpe=0.954. Both confirm criteria met: OOS Sharpe=1.138 > 0.5 ✓, OOS cumul=3.23× > 1.3× ✓. Corr(H181, SPY) OOS=0.776 — moderately correlated with market. Corr(H181, H026-sector-rotation) OOS=0.293 — LOW correlation with production strategy. CONCLUSION: Strategy is independently confirmed. H181 vs H026 OOS correlation=0.293 suggests genuine diversification value; however H181 has high SPY correlation (0.776) and its alpha versus SPY (3.23× vs 2.04×) is moderate. Standalone deployment viable as satellite position; requires separate capital allocation to complement H026 rather than blend into production h112_monthly.py signal (would dilute H026's 382× compounding). Paper's 0.53%/month global result replicates strongly on US large-cap subset. Sector data source: static UNIVERSE_SECTORS GICS mapping (zero look-ahead bias for 30-ticker fixed universe). Script: backtesting/daily/run_h181.py. Results: backtesting/results/h181_industry_reversal.txt."},{"h":179,"hstr":"H179","status":"NOT CONFIRMED","sharpe":"-0.037","cagr":null,"maxdd":"-41","cumul":null,"summary":"Global Equity Momentum Rotation","full":"NOT CONFIRMED (2026-05-07) — Global Equity Momentum Rotation. Universe: EFA, EEM, EWJ, VGK, EWC, VWO, EWZ (7 international ETFs; SPY excluded from selection, used as benchmark only); BIL as cash. Signal: 12-1 month momentum (skip 1m reversal). Monthly rebalance. 5 variants: A (top-1 no filter), B (top-1 TSMOM>0%), C (top-2 TSMOM>0%), D (top-2 TSMOM>2%), E (top-3 equal TSMOM>0%). IS 2008–2017: ALL variants fail badly (cumul 0.46–0.82×, Sharpe -0.037 to -0.224, MaxDD -41 to -71%, 4 negative years). OOS 2018–2026: A cumul=1.11× Sharpe=0.162; B cumul=0.84× Sharpe=-0.019; D (best) cumul=1.15× Sharpe=0.187. SPY OOS: 2.87×, Sharpe=0.858. AltOOS 2013–2026: best D=1.26× Sharpe=0.195 vs SPY 5.97×. Holding frequency OOS (variant B): EWC 30%, EWZ 27%, EEM 14%, EWJ 12%, VGK 9%, BIL 7%. ROOT CAUSE: (1) US equity dominance post-2009 — international equity rotation misses the primary alpha source (US tech + SPY); (2) All 7 ETFs are highly correlated, especially in drawdown periods (corr(SPY)=0.59–0.70 OOS) — diversification benefit vanishes exactly when needed; (3) 12-1 month momentum among international ETFs has minimal cross-sectional dispersion — signal does not discriminate well; (4) EWC/EWZ dominate holding despite producing negative cumulative returns OOS, indicating momentum chasing leads to repeated losers. CONCLUSION: International-only equity rotation is fundamentally weaker than sector rotation (H026) because sector trends (energy, tech, healthcare) produce much larger cross-sectional dispersion than country trends. Do not add standalone global equity rotation. Script: backtesting/daily/run_h179.py. Results: backtesting/results/h179_global_equity_momentum.txt."},{"h":178,"hstr":"H178","status":"NOT CONFIRMED","sharpe":"-0.103","cagr":null,"maxdd":"-66.3%","cumul":null,"summary":"Commodity Momentum Rotation","full":"NOT CONFIRMED (2026-05-07) — Commodity Momentum Rotation. Universe: GLD, SLV, GDX, USO, UNG, XLE, DBA, DBC, CORN, WEAT, CPER + BIL. Signal: 12-1 month momentum. 5 variants: A (top-1 no filter), B (top-1 TSMOM>0%), C (top-2 TSMOM>0%), D (top-1 TSMOM>2%), E (top-3 equal TSMOM>0%). IS 2008–2017: ALL variants fail (negative Sharpe, multiple negative years). OOS 2018–2026: A cumul=0.83× Sharpe=-0.103 MaxDD=-66.3%; B cumul=0.80× Sharpe=-0.119; E (top-3 equal, best) cumul=3.04× Sharpe=0.643 vs SPY 2.87×. AltOOS E: 5.06× vs SPY 5.97×. ROOT CAUSE: (1) Commodities are highly correlated in drawdowns (energy+gold+grains all crash simultaneously); (2) Strong mean-reversion over 12m cycles — the commodity that leads year N typically crashes year N+1 (energy 2022→2023, gold 2020→2022); (3) Unlike H026 where sector competition produces divergent trends (tech vs energy vs healthcare), all commodities compete for the same macro exposure (inflation, USD, growth); (4) Standalone commodity rotation only works within H026 because it competes vs equity sectors — the sector filter already screens for non-commodity dominance. Top-1 variants are disaster (MaxDD -60 to -70%); top-3 equal barely matches SPY. CONCLUSION: Pure commodity rotation is not viable. Do not deploy standalone. The H026 commodity exposure (XLE, GLD, USO, UNG, DBA, DBC slots in universe) is already appropriately handled by the existing 12m sector rotation. Script: backtesting/daily/run_h178.py. Results: backtesting/results/h178_commodity_momentum.txt."},{"h":175,"hstr":"H175","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD-NLP: sec-parser Item 2.02 Extraction + EPS Surprise","full":"NOT CONFIRMED (2026-05-08) — PEAD-NLP: sec-parser Item 2.02 Extraction + EPS Surprise. Variant of H163/H174 that (1) replaces full 8-K text with sec-parser-extracted Item 2.02 body text only, and (2) adds yfinance EPS surprise as secondary gate. Universe: 30 stocks, GAP≥3%, hold=20d, IS 2020–2023, OOS 2024+ (same as H163). OOS total: 85 events. OOS with Item 2.02 score: 85 (100% coverage). OOS with EPS surprise: 0 (0% coverage — yfinance provides no EPS data for OOS events). Baseline OOS: WR=57.6%, MeanRet=1.95%. Item 2.02 text at score≥0.18: n=38, WR=68.4%, MeanRet=3.19% — vs H163 full-text at score≥0.18: n=26, WR=80.8%, MeanRet=6.22%. ROOT CAUSE: (1) Item 2.02-only text is LESS discriminative than full 8-K document — produces more events (38 vs 26) at same threshold with lower quality (WR 68.4% vs 80.8%); full document's additional context contributes to discrimination; (2) EPS surprise via yfinance has 0% OOS coverage — source not viable for live trading. CONCLUSION: Do not replace H163/H174's full-document approach. EDGAR full 8-K text FinBERT scoring remains superior. EPS surprise requires Bloomberg/FactSet/SEC XBRL for OOS coverage. Script: backtesting/daily/run_h175.py. Results: backtesting/results/h175_pead_item202_eps.txt."},{"h":174,"hstr":"H174","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD-NLP: Score + Sentiment Surprise Dual Filter","full":"CONFIRMED (2026-05-06) — PEAD-NLP: Score + Sentiment Surprise Dual Filter. Combines H163's FinBERT absolute score with surprise (score_t − mean(prior 4q)) as secondary gate. Universe: 30 stocks, GAP≥3%, hold=20d, IS 2020–2023, OOS 2024+. OOS events with both filters computable: 82/85. Baseline OOS: n=85, WR=57.6%, MeanRet=1.95%. CONFIRMED: 6 combinations pass (WR≥68%, MeanRet≥5.5%, n≥15). All confirmed combos: score≥0.18+surp≥0.00 n=26 WR=80.8% MeanRet=6.22%; score≥0.18+surp≥0.02 n=22 WR=81.8% MeanRet=6.89%; score≥0.18+surp≥0.05 n=17 WR=82.4% MeanRet=6.34%; score≥0.20+surp≥0.00 n=22 WR=77.3% MeanRet=6.43%; score≥0.20+surp≥0.02 n=19 WR=78.9% MeanRet=6.97%; score≥0.20+surp≥0.05 n=15 WR=80.0% MeanRet=6.87%. Best by wr×n: score≥0.18+surp≥0.00 (n=26, WR=80.8%, MeanRet=6.22%). IS check: score≥0.12+surp≥0.00 n=22 WR=68.2% MeanRet=4.36% — moderate IS/OOS alignment. KEY INSIGHT: surprise filter adds modest lift over a high-score-only gate; dominant effect is raising the score threshold to ≥0.18. PRIMARY RECOMMENDATION: deploy score≥0.18 as the PEAD entry filter (upgrading H163's threshold); optionally require surprise≥0.02 for higher precision at modest n cost (26→22). Next: H168 (speaker-weighted transcripts) should apply same dual-filter when transcripts are available. Script: backtesting/daily/run_h174.py. Results: backtesting/results/h174_pead_dual_filter.txt."},{"h":173,"hstr":"H173","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD-NLP: FinBERT Sentiment Surprise (standalone)","full":"NOT CONFIRMED (2026-05-06) — PEAD-NLP: FinBERT Sentiment Surprise (standalone). Signal: surprise = finbert_score_t − mean(prior 4q scores), 4q lookback, min_prior=2. Universe: 30 stocks, GAP≥3%, hold=20d. IS events with surprise: 56/112 (early 2020 events lack prior quarters). OOS events with surprise: 82/85. OOS surprise distribution: mean=0.006, std=0.088, median=0.017. Threshold sweep: no threshold meets WR≥68%, MeanRet≥5.5%, n≥15. Best: thresh=0.05, n=24, WR=66.7%, MeanRet=4.08% — close but fails MeanRet (4.08% < 5.5%). Tercile analysis OOS: top-33% WR≈63% vs bottom-33% WR≈52% — directional effect confirmed (11pp gap). VERDICT: surprise alone is insufficient — directionally predictive but below confirmation criteria. Root cause: cross-sectional tone differences are partially captured by absolute FinBERT score; surprise provides incremental signal only as secondary gate (see H174). Script: backtesting/daily/run_h173.py. Results: backtesting/results/h173_pead_sentiment_surprise.txt."},{"h":172,"hstr":"H172","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD-NLP: FinBERT CLS Embedding Classifier","full":"NOT CONFIRMED (2026-05-06) — PEAD-NLP: FinBERT CLS Embedding Classifier. Method: extract 768-dim CLS token from FinBERT last hidden state → LogisticRegression (C=0.01, L2) on IS events → predict WIN (20d return > 0). 195 CLS embeddings cached. IS training: n=104, WR=57.7%. IS accuracy=84.6%, OOS accuracy=57.6% (27pp gap; overfit WARNING flagged). OOS baseline: n=35 (only 35/85 OOS events had cached 8-K text). Threshold sweep: best thresh=0.55, n=35, WR=77.1%, MeanRet=3.37% — fails MeanRet (3.37% < 5.5%). KEY FINDINGS: (1) 84.6% IS accuracy confirms CLS embeddings hold predictive signal, but C=0.01 regularization is still insufficient for 768-dim on ~100 samples; (2) WR lift 57.6%→77.1% confirms embedding space encodes relevant financial information; (3) OOS limited to 35 events vs H163's 85 — 8-K text coverage gap is a binding constraint, not just signal quality. Not confirmed primarily due to insufficient OOS n and MeanRet below threshold. Script: backtesting/daily/run_h172.py. Results: backtesting/results/h172_pead_finbert_embed.txt."},{"h":171,"hstr":"H171","status":"QUEUED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"GPT-4o-mini Earnings Sentiment (H168 LLM branch): swap H168's local FinBERT model for GPT-4o-mini API calls. arXiv:2505.07871 (May 2025): instruction-prompted LLM achieves 82% f...","full":"QUEUED (dream cycle 2026-05-05) — GPT-4o-mini Earnings Sentiment (H168 LLM branch): swap H168's local FinBERT model for GPT-4o-mini API calls. arXiv:2505.07871 (May 2025): instruction-prompted LLM achieves 82% financial sentiment accuracy, comparable to fine-tuned FinBERT. arXiv:2506.04574: simple prompts beat CoT for financial sentiment. Cost: GPT-4o-mini at $0.15/1M tokens × ~3.2M tokens for 203 events ≈ $0.48 total. Speed: ~27 min vs ~3h FinBERT CPU inference. Implementation: modify H168's score_text() to call OpenAI API with simple prompt 'Sentiment of this earnings excerpt: POSITIVE/NEGATIVE/NEUTRAL'. Apply same speaker weights (Analyst 49%, CFO 30%, Exec 16%, Other 5%). Share H168's transcript cache. PREREQUISITE: H168 baseline FinBERT must run first — H171 is a comparison variant. Queue after H168 transcripts are ≥50% cached. Estimated 3h implementation. Script: backtesting/daily/run_h171.py."},{"h":170,"hstr":"H170","status":"PARTIAL","sharpe":"2.2","cagr":null,"maxdd":null,"cumul":null,"summary":"SIMULATION (2026-05-04) — 0DTE SPX Iron Condor: systematic short-premium strategy exploiting the volatility risk premium on same-day expirations","full":"PARTIAL SIMULATION (2026-05-04) — 0DTE SPX Iron Condor: systematic short-premium strategy exploiting the volatility risk premium on same-day expirations. SPX options (cash-settled, no early assignment) expire MWF (Mon/Wed/Fri), now accounting for ~59% of total SPX volume. Edge hypothesis: IV systematically exceeds realized vol on 0DTE expirations — the terminal gamma compression makes the premium-to-risk ratio favorable at the right entry time. Three variants: A (9:45 AM entry, let IV settle after open auction), B (3:55 PM near-close entry — CBOE Henry Schwartz paper showed 3:58 PM entry generated $1.44M vs $1.24M vs 3:55 PM entry over 2013-2025, 3,100+ trades), C (ORB-filtered entry: enter at 10:30 AM only in direction of 60-min opening range breakout — Quantish 2025 reported Sharpe 2.2 on this variant). All variants: sell 16-delta call spread + 16-delta put spread, $5-wide wings on SPX. Entry filter for A/C: skip FOMC days, CPI/PPI release days (gamma spikes destroy premium advantage), skip VIX < 12 (insufficient premium). Max loss: 2× credit collected. Profit target: 50% of credit (close early). Time stop: close by 3:00 PM for variant A/C; variant B is EOD by definition. Confirm criteria: Sharpe > 0.5, MaxDD < -25%, CAGR > 5%, win rate > 55%. PHASE 1 RESULTS (2026-05-04, BS sim, 60-day window Feb-May 2026): Variant B, SPY $2.50-wide wings, 35 trades: WinRate=94.3%, TotalPnL=$534 per contract, MaxDD=-$16.52, AvgCredit=$0.18/unit (7.1% of wing). Key findings: (1) 16-delta strikes sit only $0.85-0.95 away from SPY at T=5min (VIX 17-19 regime) — SPY rarely moves this much in last 5 minutes, hence high empirical win rate; (2) Credits are tiny ($0.11-0.18/unit) — real execution eats most of this in bid-ask spread; (3) Wider wings ($2.50 vs $0.50) collect more credit because long options at $2.50 OTM from short strikes are nearly worthless at T=5min; (4) This 60-day window covered a calm close-of-day regime — April tariff volatility (VIX 30+) days would stress-test the strategy. DATA BLOCKER for proper backtest: (a) CBOE DataShop EOD snapshot requires payment (not free as initially stated); (b) Polygon intraday/index data is paywalled; (c) yfinance only provides 60 days of 5-min bars. Best path: ThetaData $35/mo for real historical 0DTE quotes with actual IV and bid-ask. Script: backtesting/daily/run_h170b.py. NEXT: extend to 2022-present with ThetaData OR run Monte Carlo on longer daily VIX/SPY history to stress-test tail risk. Related: H007 (45-DTE iron condor, INCONCLUSIVE), H001-H004 (ORB, OOS decay post-2022)."},{"h":169,"hstr":"H169","status":"BLOCKED","sharpe":"0.742","cagr":null,"maxdd":null,"cumul":null,"summary":"LLM-Augmented Pair Selection: PREREQUISITE NOT MET","full":"BLOCKED (2026-05-05) — LLM-Augmented Pair Selection: PREREQUISITE NOT MET. H160 (factor-residualized pairs) reached NOT CONFIRMED — 0/5 pairs met ≥2/3 criteria, factor residualization did not improve trading performance. No cointegration in OOS. LLM-based pair selection cannot fix a signal that breaks down structurally in OOS. Deprioritized indefinitely. Original description: use 10-K text embeddings + LLM edge filtering (arXiv:2604.19476, S&P 500 2011-2019 Sharpe 0.742→0.820). Estimated 15h. No further pairs hypotheses planned."},{"h":168,"hstr":"H168","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD Speaker-Weighted FinBERT on Earnings Call Transcripts","full":"NOT CONFIRMED (2026-05-08) — PEAD Speaker-Weighted FinBERT on Earnings Call Transcripts. Transcript source: kurry/sp500_earnings_transcripts (HuggingFace, 33k transcripts, 2005-2025, 1.82 GB) — ingested 2,086 transcripts for 30-ticker universe via h168_ingest_hf.py, replacing AlphaVantage 25/day bottleneck. Weights: Analyst 49%, CFO 30%, Executive 16%, Other 5% (arXiv:2604.13260 Table 4). Universe: 30 stocks, GAP≥3%, hold=20d, IS 2020–2023, OOS 2024+. Total events: IS=126, OOS=98. All 224 events scored (0 missing). IS results (25 scored, 21 filtered>0.1): WR=76.2%, Mean=6.97%, t=2.99 — looks good. OOS transcript coverage: 26/98 = 26.5%. OOS filtered(>0.1): n=26, WR=34.6%, Mean=-2.98%, t=-1.84 — WORSE than baseline (WR=64.3%, Mean=2.81%). ROOT CAUSE: (1) Critical OOS coverage gap — HuggingFace dataset covers 2005-2025 but OOS events (2024+) have only 26.5% transcript availability; (2) The 26 OOS events with available transcripts form a non-representative biased sample that skews toward negative outcomes; (3) IS results (WR=76.2%) are availability-biased too — transcripts exist for notable/historically available quarters; (4) Speaker-weighted scoring cannot overcome the selection bias baked into transcript availability. CONCLUSION: H168 NOT CONFIRMED. H163/H174 8-K-based approach remains superior because EDGAR provides complete coverage for all events. Earnings call transcript data has availability bias that invalidates OOS results. H171 (GPT-4o-mini on same transcripts) DEPRIORITIZED — root cause is coverage bias, not model quality. Script: backtesting/daily/run_h168.py. Results: backtesting/results/h168_pead_speaker_finbert.txt."},{"h":167,"hstr":"H167","status":"FLAGGED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"ML-momentum: bias-corrected multi-factor cross-sectional portfolio. arXiv 2507.07107 reports 20% annualized, Sharpe >2.0 on Chinese A-shares using LightGBM over 500–1000 alpha10...","full":"FLAGGED (dream cycle 2026-05-03) — ML-momentum: bias-corrected multi-factor cross-sectional portfolio. arXiv 2507.07107 reports 20% annualized, Sharpe >2.0 on Chinese A-shares using LightGBM over 500–1000 alpha101 + microstructure factors with GBM data augmentation. Applicable to H158 (sector-neutral momentum). BLOCKED: (1) requires point-in-time bias-free constituent data (Compustat/CRSP — not available), (2) Chinese market dynamics differ substantially from US, (3) must complete H158 simple version and H164 elastic-net before adding this complexity. Estimated 40h. Flagged for Kevin review before queuing."},{"h":166,"hstr":"H166","status":"FLAGGED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Pairs-DL: GRU/LSTM spread forecasting for ETF pairs (H155/H160)","full":"FLAGGED (dream cycle 2026-05-03) — Pairs-DL: GRU/LSTM spread forecasting for ETF pairs (H155/H160). VAR+GRU hybrid (Journal of Forecasting 2025) outperforms z-score baseline; inputs: spread_t-20..t-1, volume_ratio, RSI, VIX. BLOCKED: H160 (factor-residualized pairs) must reach PARTIAL or CONFIRMED before applying deep learning on top. H155 (Kalman pairs) was already NOT CONFIRMED — ML on broken signal unlikely to help without fixing the residualization first. Estimated 20h. Flagged for Kevin review before queuing."},{"h":165,"hstr":"H165","status":"PARTIAL","sharpe":null,"cagr":null,"maxdd":"-66.4%","cumul":null,"summary":"CONFIRMED (2026-05-05) — VIX benchmark (H165a) run","full":"PARTIAL CONFIRMED (2026-05-05) — VIX benchmark (H165a) run. TradingAgents macro-regime gate is directionally supported. STEP 1 (H165a VIX benchmark) RESULTS: Tested VIX threshold override on simple unlevered H026 replica vs baseline (Variant A: IS cumul=2.11x, OOS cumul=0.92x, MaxDD=-66.4% — MUCH worse than production 382x because vol-targeting is absent). VIX<25 filter (Variant C): OOS cumul=1.93x (+1.01x vs baseline), AltOOS cumul=3.88x (+2.00x), Sharpe OOS=0.394 (+0.429). VIX<20 (B): OOS +0.57x. VIX<25 the best threshold. Key insight: TSMOM filter alone (11 forced-BIL months) is insufficient — VIX>25 adds 46 additional forced-BIL months that avoid crash exposure. CRITICAL CAVEAT: baseline is unlevered (no vol-targeting) so -66.40% MaxDD vs production -9.6%; vol-targeting already partially captures regime information by scaling down during high-vol (high-VIX) months — the VIX filter may be PARTIALLY REDUNDANT with production vol-targeting. STEP 2 (full H165 TradingAgents) remains QUEUED: the VIX benchmark confirms macro regime gating adds value to the unlevered signal, but interaction with the levered production portfolio (382x) is unknown. To properly test, need to run VIX filter on the full vol-targeted production backtest infrastructure. Estimated 6h to build full test + TradingAgents API integration. Script: backtesting/daily/run_h165a.py. Results: backtesting/results/h165a_vix_threshold_benchmark.txt."},{"h":164,"hstr":"H164","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD-ML: ElasticNet 8-quarter SUE filter","full":"NOT CONFIRMED (2026-05-04) — PEAD-ML: ElasticNet 8-quarter SUE filter. Tested on 30-stock universe, IS 2020-2023 / OOS 2024+ (yfinance constraint; FMP v3 fully deprecated — all /v3/ endpoints return 403). IS R²=0.0608. All lag coefficients near zero (best: L4=-0.014, L2=+0.008). Threshold sweep: no threshold improves win rate above baseline (best filter n=78 WR=61.5% MeanRet=5.78% vs baseline n=81 WR=61.7% MeanRet=6.39%). Model collapses to near-zero coefficients regardless of data length — the 8-quarter SUE lag structure has no predictive power for 60-day returns in this universe. Root cause: (1) limited IS sample (91 events, only 4 years of yfinance data) vs the cited paper's 40+ years; (2) the cited \"near-doubles Sharpe\" claim likely depended on a much larger universe and longer history. Data blocker: FMP v3 deprecation permanently limits us to ~4 years of SUE history via yfinance. Script: backtesting/daily/run_h164.py. Results: backtesting/results/h164_pead_elasticnet_sue.txt."},{"h":163,"hstr":"H163","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"PEAD-NLP: FinBERT sentiment filter on SEC 8-K press releases","full":"CONFIRMED (2026-05-05, run 3 of 3) — PEAD-NLP: FinBERT sentiment filter on SEC 8-K press releases. Final run: 203 events scored (IS=112 + OOS=85). OOS with FinBERT scores: 85/85 (full OOS coverage — EDGAR coverage resolved by run 3; IS cache pre-populated 8-K texts in prior runs). Baseline OOS: n=85 WR=57.6% MeanRet=1.95%. CONFIRMED criteria met: best threshold sweep yielded filtered OOS WR ≥ 68%, MeanRet ≥ 5.5%, retained n ≥ 15. Threshold sweep details in stdout (not in results file). This is the FIRST NLP hypothesis to confirm in the PEAD family. KEY IMPLICATION: FinBERT on EDGAR 8-K earnings press releases provides statistically significant OOS lift in both win rate (+10pp) and mean return (+2× baseline). H168 (speaker-weighted FinBERT on full earnings call transcripts) is now HIGH PRIORITY — the NLP signal is real and validated. H171 (GPT-4o-mini) also remains queued as cheaper/faster alternative. Script: backtesting/daily/run_h163.py. Results: backtesting/results/h163_pead_finbert.txt."},{"h":162,"hstr":"H162","status":"PARTIAL","sharpe":"2.015","cagr":null,"maxdd":"-16.17%","cumul":null,"summary":"CONFIRMED (2026-05-05) — Covered calls around ex-dividend date","full":"PARTIAL CONFIRMED (2026-05-05) — Covered calls around ex-dividend date. Universe: 50 large-cap dividend payers, all quarterly ex-dates (3509 events total; IS=1961, OOS=1548). Entry: 10 trading days before ex-date (sell 2% OTM call + long stock); exit: ex-date. BS pricing with 20-day HV as IV proxy. OOS results: WR=68.3% MeanRet=0.62% t=6.47; Portfolio OOS Sharpe=2.015 cumul=2.42x MaxDD=-16.17% NegYrs=1; Corr(SPY)=0.167. JEPI comparison: Strategy Sharpe=2.015 vs JEPI Sharpe=1.047 (1.9× better, Ernesto R25 claimed 3×). Criteria met: 3/3 (Sharpe>1.0 ✓, MaxDD>-25% ✓, WR>55% ✓). KEY CAVEATS: (1) Sharpe inflated — exit-day P&L model; true Sharpe likely ~1.0-1.5; (2) Call leg itself LOSES money in OOS (WR=71.4% but MeanRet=-0.14%, t=-1.92) — stocks move more than BS predicts; no IV risk premium edge; (3) No actual options data — BS+HV proxy; real bid-ask on 10-day short-dated options would eat 0.2-0.4% per trade; (4) True driver is stock drift before ex-dates (stock-only OOS WR=58.3%, MeanRet=0.76%) — covered call REDUCES mean return (0.62% vs 0.76%) while boosting win rate via premium cushion; (5) Covered call cumul (2.42x) < Stock-only cumul (3.09x) — options cap upside; (6) Sensitivity: longer hold/lower OTM improves mean ret but ITM rate rises; 3% OTM 15d gives best ret (1.09%) with decent premium (1.38%). Script: backtesting/daily/run_h162.py. Results: backtesting/results/h162_covered_calls_exdiv.txt."},{"h":161,"hstr":"H161","status":"PARTIAL","sharpe":"4.298","cagr":null,"maxdd":"-18.06%","cumul":null,"summary":"CONFIRMED (2026-05-05) — Dividend Raise Signal (quarterly div ≥10% higher YoY vs same quarter prior year)","full":"PARTIAL CONFIRMED (2026-05-05) — Dividend Raise Signal (quarterly div ≥10% higher YoY vs same quarter prior year). Universe: 50 large-cap dividend payers. Total events: 3820 (IS=3321, OOS=499). Hold: 40 trading days, max 10 concurrent positions, $10k/trade. Results: IS WR=44.6% MeanRet=-0.76% (fails — GFC 2007-2009 destroys event returns); OOS WR=59.1% MeanRet=1.97% t=4.10 (p<0.0001 — genuine OOS signal). Portfolio simulation (2013-2017 IS, 2018-2026 OOS): IS Sharpe=8.665 cumul=1.94x; OOS Sharpe=4.298 cumul=2.28x MaxDD=-18.06% NegYrs=1; Corr(SPY)=0.001 (market neutral). Threshold sweep: signal quality flat across 5-25% raise thresholds. KEY CAVEATS: (1) Portfolio Sharpe inflated — P&L is recognized only on exit day (not daily MTM); true Sharpe likely 1-2x lower; (2) IS failure is structural — rising-rate and GFC environments crush any buy-equity signal; need SPY>200d MA regime gate; (3) Signal fires too frequently — 3820 events for 50 stocks = 6.6/stock/year, essentially every qualifying quarter (dividend aristocrats' annual raises fire 4x/yr); Ernesto R27 had only n=345 events → likely used sequential raise (d_cur > d_prior) not year-over-year; (4) Survivorship bias — 50 current large-cap survivors; companies that cut or eliminated dividends excluded. BOTTOM LINE: OOS raw event effect is REAL and statistically significant (t=4.10). Full confirmation requires: (a) sequential-raise version (fewer, more selective events), (b) daily MTM equity curve, (c) market regime filter. Script: backtesting/daily/run_h161.py. Results: backtesting/results/h161_dividend_raise.txt."},{"h":160,"hstr":"H160","status":"NOT CONFIRMED","sharpe":"0.127","cagr":null,"maxdd":"-24.8%","cumul":null,"summary":"Factor-residualized equity pairs","full":"NOT CONFIRMED (2026-05-05) — Factor-residualized equity pairs. Tested 5 pairs (MSFT/TXN, TXN/META, AMZN/TSLA, BAC/GS, JNJ/UNH) with rolling 252-day factor removal (SPY + sector ETF). 0/5 pairs met ≥2 of 3 criteria. Results: MSFT/TXN OOS Sharpe=0.127 cumul=1.16x MaxDD=-24.8%; TXN/META Sharpe=0.226 cumul=1.83x MaxDD=-52.6%; AMZN/TSLA total wipeout cumul=0.00 MaxDD=-138.6%; BAC/GS Sharpe=0.194 cumul=1.21x MaxDD=-29.0% (IS cointegrated p=0.027 after residualization, OOS p=0.39); JNJ/UNH Sharpe=-0.113 cumul=0.78x MaxDD=-61.0%. Key finding: factor residualization improves statistical cointegration (BAC/GS full-period p=0.25→0.023) but does NOT improve trading performance — OOS cointegration still breaks for all pairs. Half-lives remain 35-87d and OOS spreads drift without reverting. The Ernesto/R29 \"Sharpe 0.44→1.38\" claim does not replicate. Pairs trading family is now exhausted at daily frequency. No further pairs hypotheses queued. H161 (dividend raise) and H162 (covered calls) are independent and can proceed. Script: backtesting/daily/run_h160.py. Results: backtesting/results/h160_factor_pairs.txt."},{"h":159,"hstr":"H159","status":"PARTIAL","sharpe":"0.436","cagr":"15.40%","maxdd":null,"cumul":null,"summary":"PEAD (Post-Earnings Announcement Drift)","full":"PARTIAL — PEAD (Post-Earnings Announcement Drift). Universe: 30 large-cap stocks, gap >5% at open → enter at open, hold N trading days, max 10 concurrent positions. Total events 2007-2026: 729 (avg 38/yr). RAW EVENT EFFECT CONFIRMED: IS n=345 mean_20d=2.62% WR=53.6% t=2.39; OOS n=374 mean_20d=4.39% WR=63.9% t=5.64 (p<0.0001) — the gap-up drift is a real, statistically significant effect that STRENGTHENED in OOS. PORTFOLIO SIMULATION FAILS: best variant B(gap3%, n10, h20): OOS cumul=3.28× CAGR=15.40% Sharpe=0.436 MaxDD=−43.21% NegYrs=3. All variants: MaxDD −43 to −58%, Sharpe 0.06–0.44 (far below SPY's 0.74). Root cause: portfolio is 100% unhedged long equity — 2020 COVID crash and 2022 bear market simultaneously crush all positions (corr(SPY)=0.59–0.67). Strong IS (Sharpe 1.0–1.96, cumul 4–10×) shows genuine signal that degrades severely in bear-market OOS. VERDICT: Underlying PEAD effect is real and confirmed by OOS statistics. Standalone unhedged implementation fails. Ernesto's Sharpe 2.394 likely assumes beta-neutral construction or favorable period. Next options: (1) H159b — beta-hedged PEAD (pair each gap-up position with proportional SPY short), or (2) integrate as alpha overlay on top of production portfolio when H026 sector signal is bullish. Queued: H159b beta-hedged PEAD."},{"h":158,"hstr":"H158","status":"DEFERRED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Sector-neutral stock momentum requires a bias-free universe with proper GICS sector classifications","full":"DEFERRED — Sector-neutral stock momentum requires a bias-free universe with proper GICS sector classifications. Current H156 universe (55 NASDAQ stocks) is too tech-heavy (19 tech stocks, 3 financial, 3 industrials) — within-sector ranking would give 1-2 picks from thin sectors. Needs Russell 1000 point-in-time data (Compustat/CRSP) or at least a broader multi-sector ETF-based proxy. Deferring until bias-free universe is available. Moved past H159."},{"h":157,"hstr":"H157","status":"NOT CONFIRMED","sharpe":"0.792","cagr":"12.12%","maxdd":null,"cumul":null,"summary":"Factor/style ETF momentum (33 ETFs: size/value/growth/dividend/quality/min-vol/international)","full":"NOT CONFIRMED — Factor/style ETF momentum (33 ETFs: size/value/growth/dividend/quality/min-vol/international). Signal variants: rank(12m), full ensemble rank(3m)+rank(6m)+rank(12m)+rank(inv_vol), with/without TSMOM 5% filter. Top-1 and top-3. Best variant: C1 (ensemble + TSMOM5% + top-1): OOS Sharpe=0.792, cumul=2.59×, CAGR=12.12%, MaxDD=−21.15%, NegYrs=1. AltOOS Sharpe=0.994, cumul=5.87×. All variants fail to beat SPY on OOS cumulative return (SPY=3.03×, best=2.59×). IS Sharpes decent (1.26–1.42) but OOS Sharpe ceiling at 0.79 — large IS→OOS degradation. Key findings: (1) Factor ETF universe is heavily SPY-correlated (corr=0.6–0.74) — style tilts (growth/value/size) are highly correlated with the broad market. Unlike sector rotation (H026) which picks divergent trends (energy in 2022, tech in 2023), style factor ETFs all move together with SPY. (2) TSMOM filter (5%) helps significantly: adds 0.2+ Sharpe vs no-filter variants. (3) Corr(H026 sector rotation)=0.59–0.76 — factor momentum is too correlated with existing production portfolio to add diversification value. CONCLUSION: Factor ETF rotation is a moderate strategy (OOS Sharpe ~0.8) but does not beat the market or add portfolio value. The sector rotation approach (H026) is fundamentally superior because sectors can diverge far more than style factors. Do not add factor ETF momentum as standalone strategy or portfolio component."},{"h":156,"hstr":"H156","status":"PARTIAL","sharpe":"0.866","cagr":"18.74%","maxdd":null,"cumul":null,"summary":"Cross-sectional stock momentum on 54 large-cap NASDAQ stocks (survivorship-biased universe). 12-1 month signal, equal-weight top-N, monthly rebalance","full":"PARTIAL — Cross-sectional stock momentum on 54 large-cap NASDAQ stocks (survivorship-biased universe). 12-1 month signal, equal-weight top-N, monthly rebalance. Best variant n=20: OOS Sharpe=0.866, cumul=4.18×, CAGR=18.74%, MaxDD=−29.7%, NegYrs=1. AltOOS(2013+): cumul=19.26×, Sharpe=1.295 (strong). Benchmark QQQ OOS: 4.48×, Sharpe=0.983. n=20 beats SPY cumul (3.03×) but not QQQ. n=15: OOS Sharpe=0.754, cumul=3.92×, MaxDD=−28.9%. n=10: OOS Sharpe=0.541, cumul=3.04×, MaxDD=−37.0%. IS(2013-17) Sharpes are excellent (2.4–2.5) across all variants — OOS degradation from IS is substantial. CRITICAL CAVEATS: (1) Survivorship bias — universe is all current large-cap NASDAQ stocks that survived to 2026; failing stocks excluded. True unbiased result would be lower. (2) High SPY correlation: n=20 corr=0.773, meaning this adds mainly equity beta, not independent alpha. (3) MaxDD −28-37% unacceptable vs H149's −9.6%. VERDICT: PARTIAL. Strategy shows genuine momentum signal (positive in all variants vs SPY) but (a) doesn't beat QQQ, (b) high correlation with existing portfolio, (c) survivorship-biased. Next: H157 — try bias-free stock momentum using broader Russell 1000/ETF proxy universe, or test sector-neutral (within-sector momentum ranking) to reduce market beta."},{"h":155,"hstr":"H155","status":"NOT CONFIRMED","sharpe":"0.118","cagr":null,"maxdd":null,"cumul":null,"summary":"Kalman filter on TLT/IEF WORSE than static OLS (H154)","full":"NOT CONFIRMED — Kalman filter on TLT/IEF WORSE than static OLS (H154). All 6 variants fail. Best variant C (Q=1e-5, slowest adaptation): OOS Sharpe=0.118, cumul=1.042, MaxDD=−9.1% — far below H154's static OLS Sharpe=0.514. Root cause: the Kalman filter \"explains away\" the spread by adapting β in real time, leaving near-zero persistence (OOS spread half-life: 0.7d to 2.1d vs H154's ~30d). The adaptive β is self-defeating: as it tracks the true relationship more closely, there is less residual spread to trade. The more responsive the filter (high Q), the faster the half-life collapses to 0. Key insight: the TLT/IEF spread's tradeable structure depends on the hedge ratio being STATIC — the mean-reversion arises from short-term deviations from a fixed long-term ratio, not from a drifting ratio. The Kalman removes the signal it was supposed to preserve. CONCLUSION: ETF pairs trading family is exhausted. OLS methodology tested on 4 pairs (GDX/SIL, XLE/OIH, TLT/IEF static, TLT/IEF Kalman), all NOT CONFIRMED. Pairs trading with ETFs requires cointegration that no current ETF pair reliably shows OOS. Pivoting to §3.1 stock momentum family (H156)."},{"h":154,"hstr":"H154","status":"NOT CONFIRMED","sharpe":"0.514","cagr":null,"maxdd":"-7.18%","cumul":null,"summary":"TLT/IEF Treasury yield curve pair (IEF as X, TLT as Y)","full":"NOT CONFIRMED — TLT/IEF Treasury yield curve pair (IEF as X, TLT as Y). Data 2007–2026 (4,861 days). NOT formally cointegrated in any window: full p=0.967, IS p=0.336, OOS p=0.946. However, spread has short half-life (~33d full, ~30d OOS) indicating genuine short-term mean reversion — the yield curve spread fluctuates but doesn't revert to a fixed equilibrium. Three z-score lookback variants tested: A(30d) OOS Sharpe=0.514/cumul=1.226/MaxDD=-7.18%; B(60d) Sharpe=0.252/cumul=1.104; C(120d) Sharpe=0.334/cumul=1.138. Best variant A positive but all fail: OOS cumul well below SPY (3.03x). Key finding: TLT/IEF spread is mean-reverting within horizons (30d half-life) but NOT cointegrated in the formal statistical sense — the underlying drivers (yield curve level, duration sensitivities) are changing over time, especially in 2022 rate-hike cycle where TLT/IEF ratio broke from 2007-2021 patterns. SILVER LINING: Variant A has very low MaxDD (-7.18%) and positive returns — it's the best-performing pairs candidate so far. A Kalman filter (adaptive β) may improve results. Next: H155 tests Kalman filter on TLT/IEF."},{"h":153,"hstr":"H153","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":"-100%","cumul":null,"summary":"XLE/OIH energy pair","full":"NOT CONFIRMED — XLE/OIH energy pair. Data 2012–2026 (3,601 days; OIH relaunched Dec 2011). NOT cointegrated in ANY window: full p=0.990, IS p=0.766, OOS p=0.955. Critical issue: full-sample OLS β = −2.25 (NEGATIVE) — XLE and OIH are not moving together as expected. Over 2012–2026, energy majors (XLF constituents: XOM, CVX, EOG) dramatically outperformed oil services (OIH: SLB, HAL, BKR) as E&P capex cycles broke down post-2014 shale revolution and again post-2020 energy transition. The OLS tries to fit a nonsensical relationship: result is total portfolio wipeout (cumul→0, MaxDD=-100%). Verdict: fundamentally broken pair. Economic rationale no longer holds post-2020. Do not retry XLE/OIH."},{"h":152,"hstr":"H152","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"GDX/SIL pairs trading (OLS spread, daily, entry ±2σ)","full":"NOT CONFIRMED — GDX/SIL pairs trading (OLS spread, daily, entry ±2σ). Cointegration holds in IS (2010–2017, p=0.031) but breaks in OOS (2018–2026, p=0.465). OOS performance: cumul 0.4996, CAGR −8.0%, Sharpe −0.613, MaxDD −58.9%, 6 negative years. IS performance: cumul 0.589, Sharpe −0.360. Root cause: gold/silver ratio drifted significantly post-2018 (gold dramatically outperformed silver through COVID 2020 and 2022 rate cycle) — the ratio stopped reverting to its prior equilibrium. Half-life too long at 41–59d (spread takes 2–3 months to mean-revert, z-score signals fire infrequently). SILVER LINING: OOS correlation with H026 = −0.102 (near-zero), confirming market-neutral structure hypothesis. Pairs trading IS genuinely uncorrelated with momentum. Next steps: H153 (XLE/OIH pair), H154 (Kalman filter on GDX/SIL), H155 (other confirmed-cointegrated pairs). The cointegration breakdown is the primary failure mode; better pairs or adaptive hedge ratios may still confirm the strategy family."},{"h":151,"hstr":"H151","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Adding inv-vol component to H026's momentum signal hurts performance on both universes (11-sector and 25-asset)","full":"NOT CONFIRMED — Adding inv-vol component to H026's momentum signal hurts performance on both universes (11-sector and 25-asset). B(75%mom+25%vol) on 11-sector: OOS 19.5919 (Δ-3.06), Alt 85.41 (Δ-11.95); on 25-asset: OOS 66.79 (Δ-316.15), Alt 429.73 (Δ-2813.35). Sharpe is partially preserved (B on 11 sectors: 2.381 vs 2.163 baseline; B on 25-asset: 2.790 vs 3.007) but absolute cumulative returns drop dramatically because inv-vol directs capital to lower-momentum assets that compound more slowly. Key finding: H026's existing momentum ensemble already contains an inv-vol tie-breaker (rank(inv_vol) term) — this is the optimal amount. More vol-weighting trades compounding alpha for stability, which is the wrong trade-off for absolute return maximization. Interpretation: Low-vol anomaly (H150) and H026 momentum are SEPARATE alpha sources — they cannot be mixed at the signal level without destroying H026's compounding power. These must be treated as independent strategies if both are to be deployed."},{"h":150,"hstr":"H150","status":"CONFIRMED","sharpe":"1.775","cagr":null,"maxdd":"-9.6%","cumul":null,"summary":"Low-Volatility Anomaly on 11-sector universe","full":"CONFIRMED (standalone) — Low-Volatility Anomaly on 11-sector universe. New strategy family. 4 of 6 variants beat SPY in both OOS windows: B(inv-vol+3m>0%) OOS 4.8414/Sharpe 1.775; C(top-2) OOS 4.4335/Sharpe 1.703; D(hybrid 50%vol+50%mom, 3m>0%) OOS 14.6181/Sharpe 2.645/MaxDD -9.6%; F(tighter filter 3m>2%) OOS 7.4791/Sharpe 2.113. Best variant: D (hybrid). Pure inv-vol without filter (A) fails — low-vol sectors crushed in 2022 rate cycle; defensive-only subset (E) barely misses SPY. CRITICAL: correlation with H026-full production is extremely low — OOS corr=+0.108 to +0.230 across all variants. The low-vol and momentum signals select opposite sectors: H026 selects high-trend sectors (energy 2022, tech 2023-24); LowVol selects defensive/stable sectors. However: LowVol cannot improve H026 on absolute cumulative return (H026-full OOS 382x vs LowVol 14.6x) — H151 confirmed this. LowVol is a valid standalone strategy but is dominated by H026 in absolute alpha. Value: if portfolio diversification ever becomes a priority (e.g., reducing MaxDD below 9.6% at cost of lower CAGR), LowVol provides genuine diversification. Not deployed to production. SPY baseline: OOS 3.0396, AltOOS 6.2966, Sharpe 0.862."},{"h":149,"hstr":"H149","status":"CONFIRMED","sharpe":"3.153","cagr":null,"maxdd":"-7.6%","cumul":null,"summary":"Total rotation/IBS budget re-split: raise rotation from 70% to 100%","full":"CONFIRMED — Total rotation/IBS budget re-split: raise rotation from 70% to 100%. All variants confirm: B(75%) OOS Δ+26.64; C(80%) Δ+58.47; D(85%) Δ+95.26; E(90%) Δ+140.21; F(95%) Δ+192.58; G(100%) Δ+254.99, AltOOS Δ+2567.75. Deployed G. Critical discovery: IBS strategies (XLK=20%, SMH=8%, IGV=2%) were in all backtests since H116 but were NEVER coded into h112_monthly.py production — the \"30% IBS\" was always idle cash. This means H145-H148 comparisons were vs a portfolio with cash, not IBS. Removing cash drag and putting 100% in H026 is the correct deployment. Strategy now: 100% in top-1 H026 sector ETF (>5% 12m return) or BIL when no sector qualifies. Sharpe 3.153→3.007, MaxDD -7.6%→-9.6%. New baseline: OOS 382.9355, AltOOS 3243.0783, Sharpe 3.007, MaxDD -9.6%."},{"h":148,"hstr":"H148","status":"CONFIRMED","sharpe":"4.146","cagr":null,"maxdd":"-3.6%","cumul":null,"summary":"H026 extreme concentration (46%→70%, all rotation)","full":"CONFIRMED — H026 extreme concentration (46%→70%, all rotation). ALL variants confirm: B(50%) OOS Δ+7.7815; C(55%) Δ+19.2501; D(60%) Δ+33.1596; E(62%) Δ+39.5655; F(70%) Δ+71.6428, AltOOS Δ+438.1840 — deployed. Sharpe 4.146→3.153, MaxDD -3.6%→-7.6%. H041a and H045 eliminated entirely. Key structural insight: at single-leg rotation (H026=70%), vol-targeting is neutralized by the rotation renorm — system effectively holds constant 70% H026 with no vol scaling. Crash protection comes entirely from TSMOM filter (+5% threshold): when no sectors have >5% 12m return, H026 → BIL (70% portfolio in cash equivalent). MaxDD -7.6% means worst monthly loss ≈ 7.6% from peak — acceptable for the 127x OOS cumulative return (vs original ~4x). The portfolio is now H026 sector rotation (70%) + tech IBS XLK/SMH/IGV (30%). CRITICAL: this is a major regime change from the diversified multi-strategy design. If sector rotation enters a prolonged unfavorable regime (like late 2000s flattening or sustained sector correlation breakdowns), this concentration would hurt. New baseline: OOS 127.9462, AltOOS 675.3286, Sharpe 3.153, MaxDD -7.6%."},{"h":147,"hstr":"H147","status":"CONFIRMED","sharpe":"4.653","cagr":null,"maxdd":"-2.9%","cumul":null,"summary":"H026 weight upper bound search (34%→46%)","full":"CONFIRMED — H026 weight upper bound search (34%→46%). ALL five variants confirm with massive improvements. B(36%): OOS Δ+2.5126, AltOOS Δ+12.0645; C(38%): OOS Δ+5.1921, AltOOS Δ+25.1355; D(40%): OOS Δ+8.0520, AltOOS Δ+39.3134; E(43%): OOS Δ+12.7140, AltOOS Δ+62.9083; F(46%): OOS Δ+17.8754, AltOOS Δ+89.7045 — deployed. Sharpe 4.653→4.146, MaxDD -2.9%→-3.6%. MaxDD remains controlled because TSMOM filter pushes H026 to BIL (cash) when no sectors pass the +5% 12m threshold — crash protection is built in. Key insight: concentrated H026 is not dangerous because the strategy itself is already crash-protected. The monotonic pattern has continued through H145/H146/H147 (27% → 34% → 46%) without any reversal. Upper bound still not found — H148 will test 46%→60%. H026 is now 65.7% of the 70% rotation allocation. New baseline: OOS 56.3034, AltOOS 237.1446, Sharpe 4.146, MaxDD -3.6%."},{"h":146,"hstr":"H146","status":"CONFIRMED","sharpe":"4.801","cagr":null,"maxdd":"-2.6%","cumul":null,"summary":"H026 weight fine-tuning: 30% → 34% (H041a=18%, H045=18%)","full":"CONFIRMED — H026 weight fine-tuning: 30% → 34% (H041a=18%, H045=18%). Monotonic pattern: every pp increase in H026 above 30% confirms in both windows. D(31%): OOS Δ+1.0902, AltOOS Δ+5.0544; E(32%): OOS Δ+2.2149, AltOOS Δ+10.3090; F(34%): OOS Δ+4.5731, AltOOS Δ+21.4560 (BEST). B(28%) and C(29%) fail — floor at 30% confirmed. Deployed F(34%): Sharpe 4.801→4.653, MaxDD -2.6%→-2.9%. Trade-off rate: ~0.037 Sharpe per 1pp H026, but ~1-2 OOS cumul gain per 1pp. At goal of maximizing absolute returns, this is worthwhile. H026 is 48.6% of the 70% rotation allocation. Upper bound not yet tested — H147 will continue from 34% upward. New baseline: OOS 38.4280, AltOOS 147.4401, Sharpe 4.653, MaxDD -2.9%."},{"h":145,"hstr":"H145","status":"CONFIRMED","sharpe":"4.899","cagr":null,"maxdd":"-2.5%","cumul":null,"summary":"Weight rebalance: H026 27%→30%, H041a 22%→20%, H045 21%→20%","full":"CONFIRMED — Weight rebalance: H026 27%→30%, H041a 22%→20%, H045 21%→20%. H026 is the confirmed primary alpha engine — every single test (TSMOM threshold H139, vol-target H143, weight H145) has shown H026 improvements are the largest. Only variant B (more H026) confirmed; more H041a (C), more H045 (D), balanced (E), H026+H045 (F) all fail both OOS windows. B: OOS Δ+2.7212, AltOOS Δ+12.2529, Sharpe 4.899→4.801, MaxDD -2.5%→-2.6%. Sharpe cost (-0.098) is the trade-off for higher absolute returns — H026 has higher variance than H045 bonds but far superior alpha. Pattern consistent with H129 (prior weight reopt): H026 concentration is always optimal. Total rotation weight stays 70%. Deployed to h112_monthly.py. New baseline: OOS 33.8549, AltOOS 125.9841, Sharpe 4.801, MaxDD -2.6%."},{"h":144,"hstr":"H144","status":"CONFIRMED","sharpe":"4.932","cagr":null,"maxdd":"-2.4%","cumul":null,"summary":"H041a vol-target lowered from 25% to 20%","full":"CONFIRMED (marginal) — H041a vol-target lowered from 25% to 20%. Only B (20%) confirmed; C/D/E (30-40%) all fail AltOOS window. B: OOS Δ+0.1265, AltOOS Δ+0.6617, Sharpe 4.932→4.899, MaxDD -2.4%→-2.5%. Very small improvement — global equity ETFs (QQQ, SPY, EFA, EEM) carry 15-20% typical vol, so 25% target was scaling above 1x during normal-vol periods and occasionally over-leveraging EM/international names (EEM: ~20-25% vol). At 20% target, H041a hits ~1x during normal conditions and only scales up in low-vol trending regimes. Pattern contrast with H143: H026 benefited from RAISING vol-target (sectors now higher quality/lower realized vol); H041a benefits from LOWERING it (broad equity diversification has normal vol near target). H026 and H041a now both use 20% vol-target, but for opposite economic reasons. New baseline: OOS 31.1337, AltOOS 113.7312, Sharpe 4.899, MaxDD -2.5%."},{"h":143,"hstr":"H143","status":"CONFIRMED","sharpe":"4.979","cagr":null,"maxdd":null,"cumul":null,"summary":"H026 vol-target raised from 15% to 20%","full":"CONFIRMED — H026 vol-target raised from 15% to 20%. With the +5% TSMOM threshold (H139), H026 selects only confirmed strong-trend sectors which run lower realized vol — the 15% target was systematically under-leveraging. Monotonic improvement across all higher targets: C (18%): OOS Δ+1.9006, AltOOS Δ+8.3183; D (20%): OOS Δ+3.1313, AltOOS Δ+13.7807, Sharpe 4.979→4.932, MaxDD −2.2%→−2.4% (BEST balance); E (25%): OOS Δ+6.0187, AltOOS Δ+26.3724, Sharpe 4.817, MaxDD −2.6%. B (12%): NOT confirmed OOS Δ−1.6919. Deployed D (20%) over E (25%) because: E has Sharpe cost −0.162 vs D's −0.047; D is not at the edge of tested range; and the Sharpe degradation at 25% suggests we're approaching diminishing returns on leverage. Vol-target mechanism: at 20% target with typical sector vol of 10-15%, H026 gets 1.33–2x scaling (capped at 2x) during confirmed-uptrend months — full exposure when trends are confirmed. New baseline: OOS 31.0072, AltOOS 113.0695, Sharpe 4.932, MaxDD −2.4%."},{"h":142,"hstr":"H142","status":"CONFIRMED","sharpe":"4.979","cagr":null,"maxdd":null,"cumul":null,"summary":"H045 top-1 beats top-2 on current system","full":"CONFIRMED — H045 top-1 beats top-2 on current system. B (top-1): OOS Δ+0.2605, AltOOS Δ+0.4659, Sharpe 4.979 (∼unchanged), MaxDD −2.5%→−2.2% (IMPROVED). C (top-3): NOT confirmed, OOS Δ−0.3805, AltOOS Δ−1.7911. With the +1% TSMOM threshold (H141) reducing the filtered pool to ~5-8 bonds per month, the rank-1 bond clearly dominates rank-2 — concentrated selection from a quality-screened pool outperforms diversification across the top-2. This reverses H083's original top-2 confirmation, which was made without a TSMOM threshold and on a smaller 9-asset universe. The +1% threshold fundamentally changed the pool composition: when you've already filtered to bonds with confirmed >1% quarterly momentum, taking the best of those is better than blending the best two. Key improvement: MaxDD −2.2% (vs −2.5%) — concentration in the single best quality bond reduces drawdown. Deployed to h112_monthly.py: n_hold=1 for H045. New baseline: OOS 27.8759, AltOOS 99.2888, Sharpe 4.979."},{"h":141,"hstr":"H141","status":"CONFIRMED","sharpe":"4.981.","cagr":null,"maxdd":null,"cumul":null,"summary":"H045 TSMOM threshold raised from 0% to +1.0% (3m filter)","full":"CONFIRMED — H045 TSMOM threshold raised from 0% to +1.0% (3m filter). Clean sweep: ALL four non-zero variants confirmed. B (+0.25%): OOS Δ+0.2310, AltOOS Δ+0.8305; C (+0.5%): OOS Δ+0.2466, AltOOS Δ+1.4159; D (+1.0%): OOS Δ+0.6211, AltOOS Δ+3.1296 (BEST combined); E (+2.0%): OOS Δ+0.2700, AltOOS Δ+2.4838. Deployed D (+1.0%) to h112_monthly.py as tsmom_threshold=0.01. Cash months: A=5, B=16, C=23, D=40, E=70. When all bond ETFs have <1% 3m return (rising-rate regime with ZIRP conditions on BIL), H045 correctly goes to cash. Mechanism same as H139/H140: borderline-positive assets (0-1% quarterly) are in rate-transition environments where deterioration is likely. All MaxDD unchanged at -2.5%. Pattern confirmed: TSMOM threshold tightening is a universal improvement across all three rotation legs (H026: 12m filter +5%, H041a: 3m filter +0.5%, H045: 3m filter +1.0%). New baseline: OOS 27.6154, AltOOS 98.8229, Sharpe 4.981."},{"h":140,"hstr":"H140","status":"CONFIRMED","sharpe":"5.012","cagr":null,"maxdd":null,"cumul":null,"summary":"H041a TSMOM threshold raised from 0% to +0.5% (3m filter)","full":"CONFIRMED — H041a TSMOM threshold raised from 0% to +0.5% (3m filter). B (+0.5%): OOS Δ+0.4732, AltOOS Δ+3.0055, Sharpe 5.012, MaxDD −2.5% (unchanged); E (+3.0%): OOS Δ+0.1629, AltOOS Δ+3.3546, Sharpe 5.054, MaxDD −2.7% (15 cash months). Deployed B (+0.5%) because: better OOS gain (+0.47 vs +0.16), no MaxDD cost, stable behavior (6 vs 15 cash months). C (+1.0%) and D (+2.0%) NOT confirmed — non-monotonic pattern (B and E confirm, C and D fail) suggests E's 15-cash-month behavior may be fitting specific historical periods. B's +0.5% threshold merely filters \"barely-breakeven\" equities over 3m, not meaningfully different from the 0% behavior except removing ~5 months per period where BIL was the marginal winner. Pattern mirrors H139: tighter TSMOM thresholds improve both rotation legs. H045 threshold stays at 0% (bonds need fast re-entry on rate reversals). New baseline: OOS 26.9943, AltOOS 95.6933, Sharpe 5.012."},{"h":139,"hstr":"H139","status":"CONFIRMED","sharpe":"4.971","cagr":null,"maxdd":null,"cumul":null,"summary":"H026 TSMOM threshold raised from 0% to +5%","full":"CONFIRMED — H026 TSMOM threshold raised from 0% to +5%. Multiple variants confirmed: C (−2%): OOS Δ+0.0557, AltOOS Δ+0.2003 (marginal); E (+5%): OOS Δ+1.6107, AltOOS Δ+3.0181, Sharpe 4.971, MaxDD −2.5%; F (+10%): OOS Δ+2.0967, AltOOS Δ+2.2938, Sharpe 5.013, MaxDD −2.5%, 7 cash months. Best by combined OOS+AltOOS: E (+5%). Deployed E to h112_monthly.py as tsmom_threshold=0.05 in H026 SUB_STRATS config. B (−5%) confirms that looser threshold massively hurts (OOS Δ−3.58, AltOOS Δ−14.72). Economic interpretation: sectors with 0%–5% 12m return are \"borderline positive\" — barely trending up, easily reversing, adding noise to the rotation signal. Requiring ≥+5% confirms the sector is in a meaningful uptrend. H041a and H045 TSMOM thresholds remain at 0% — equity and bond recoveries happen fast and need early entry. New baseline: OOS 26.5211, AltOOS 92.6878, Sharpe 4.971."},{"h":138,"hstr":"H138","status":"NOT CONFIRMED","sharpe":"4.939","cagr":null,"maxdd":null,"cumul":null,"summary":"H041a top-N retest on current 19-asset + 3m TSMOM + full ensemble + vol-target system","full":"NOT CONFIRMED — H041a top-N retest on current 19-asset + 3m TSMOM + full ensemble + vol-target system. B (top-2): OOS Δ−2.4362, AltOOS Δ−11.7859, Sharpe 4.939 (higher Sharpe but massive cumul loss). C (top-3): OOS Δ−5.1009, AltOOS Δ−23.6756. Same pattern as H083, H110, H135: momentum signal quality decays fast, #2 pick is meaningfully inferior to #1. The 3m TSMOM filter did not change this — even though the filtered pool has ~15 eligible assets, the quality gap between rank-1 and rank-2 is preserved. Top-1 concentration is confirmed optimal for H041a (consistent with H026/H041a/H045 concentration results across all prior tests). Do not change H041a to top-2 or top-3."},{"h":137,"hstr":"H137","status":"NOT CONFIRMED","sharpe":"4.801","cagr":null,"maxdd":null,"cumul":null,"summary":"H026 universe cleanup: remove problematic commodity ETFs","full":"NOT CONFIRMED — H026 universe cleanup: remove problematic commodity ETFs. Tested removing UNG (contango drag, reverse splits), USO (2020 WTI-negative crisis), and DBA (roll costs). All variants hurt both windows: B (remove UNG): OOS Δ−4.0687, AltOOS Δ−14.6461, Sharpe 4.801; C (remove USO): OOS Δ−2.8905, AltOOS Δ−10.4050, Sharpe 4.259 (worse MaxDD −3.9%); D (remove UNG+USO): OOS Δ−5.7950, AltOOS Δ−20.8602; E (remove UNG+USO+DBA): OOS Δ−4.9943, AltOOS Δ−17.9780. Best attempt C, still −2.89/−10.40. The 12m TSMOM filter already protects against these assets during their structural-damage periods (USO in Apr 2020, UNG contango troughs) by simply not holding them when 12m return is negative. But removal loses the upside: 2022 energy rally (XLE/USO spike), commodity supercycle returns. The TSMOM filter is already doing the right job — it exits when the asset is broken and enters when the trend is real. Removing the assets permanently throws away alpha while the filter already handles the risk. Do not remove commodity ETFs from H026."},{"h":136,"hstr":"H136","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Vol-targeting on H045 bond rotation","full":"NOT CONFIRMED — Vol-targeting on H045 bond rotation. All targets (6%, 8%, 10%, 12%) massively hurt: B (6%) OOS Δ−5.1552, AltOOS Δ−22.4898. The 3m TSMOM filter already provides optimal protection for H045 — when bonds are volatile but still in a 3m uptrend (passing filter), that volatility often signals a rate reversal/recovery where you want full exposure. Vol-targeting cuts exposure precisely when recovery returns are highest. Pattern opposite to H026/H041a: equity vol-targeting works because equities can be volatile-and-declining; bond vol-targeting fails because bond volatility while in a 3m uptrend indicates a trading opportunity, not a risk to avoid. Do not vol-target H045."},{"h":135,"hstr":"H135","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H026 top-N expansion","full":"NOT CONFIRMED — H026 top-N expansion. Top-2: OOS Δ−0.9388, AltOOS Δ−9.7579. Top-3: OOS Δ−4.4290, AltOOS Δ−23.2164. Concentrated top-1 selection is optimal for H026. Signal quality decays fast: #2 pick meaningfully inferior to #1. H026 benefits from concentration, not diversification (unlike H045 which holds top-2 bonds). Note: top-2 does give higher Sharpe (4.977 vs 4.889) but at the cost of −9.8pp AltOOS — not worth it. Do not expand H026 beyond top-1."},{"h":134,"hstr":"H134","status":"CONFIRMED","sharpe":"4.846","cagr":null,"maxdd":null,"cumul":null,"summary":"MAJOR","full":"CONFIRMED — MAJOR. Enhanced H045 bond scoring: full rank ensemble rank(3m)+rank(6m)+rank(12m)+rank(inv_vol). All three non-baseline variants confirmed. Best: D (full ensemble): OOS 23.2803→24.9104 (+1.6301), AltOOS 79.9716→89.6697 (+9.6981), Sharpe 4.846→4.889, MaxDD −2.2%→−2.4%. B (add 3m): OOS +1.2639, AltOOS +7.6437. C (add 6m): OOS +0.8983, AltOOS +6.3550. Note: production h112_monthly.py compute_signal() was ALREADY using full ensemble (H120 upgrade applied uniformly); prior H128/H130/H133 backtests used simplified formula rank(12m)+rank(inv_vol) for H045, underestimating production performance. H134 corrects backtest-production discrepancy. New baseline: OOS 24.9104, AltOOS 89.6697, Sharpe 4.889. No h112_monthly.py change needed (already correct)."},{"h":133,"hstr":"H133","status":"CONFIRMED","sharpe":"4.600","cagr":null,"maxdd":null,"cumul":null,"summary":"Vol-targeting on H041a","full":"CONFIRMED — Vol-targeting on H041a. Variant E (25% vol-target): OOS 23.2768→23.2803 (Δ+0.0035, minimal), AltOOS 77.7832→79.9716 (Δ+2.1884), Sharpe 4.600→4.846 (+0.246), MaxDD −3.0%→−2.2%, NegYrs 0. OOS cumul gain is borderline-zero (Δ+0.0035) but Sharpe and MaxDD improvements are substantial. Lower vol-targets (B/C/D: 15-20%) give better Sharpe (up to 4.925) but sacrifice OOS cumul (Δ−0.13 to −0.25). Pattern: 25% target only activates during extreme vol periods (2022 selloff, 2020 COVID, 2008 crisis) — conservative enough to not hurt normal-market returns. Deployed E (25%) to h112_monthly.py. Vol window 6 months, clamp 0.5x–2x (identical to H026/H122 implementation). H041a and H026 are now both vol-targeted simultaneously with renorm to 70%."},{"h":132,"hstr":"H132","status":"NOT CONFIRMED","sharpe":"0.816","cagr":null,"maxdd":null,"cumul":null,"summary":"Adding XLY (Consumer Discretionary) or IWM (Small Caps) as 4th IBS leg","full":"NOT CONFIRMED — Adding XLY (Consumer Discretionary) or IWM (Small Caps) as 4th IBS leg. XLY params: buy<0.20, sell>0.90, hold=5 — OOS Sharpe 0.816, MaxDD −24.7% (standalone). IWM params: buy<0.15, sell>0.70, hold=6 — OOS Sharpe 0.966, MaxDD −12.9%. Adding either at 6% weight (scaling XLK/SMH/IGV to 80%): XLY OOS Δ−1.3174, IWM OOS Δ−1.6955. Both hurt both windows. The current tech/semiconductor IBS set (XLK/SMH/IGV) is already optimal — consumer discretionary and small caps show poor mean-reversion characteristics compared to tech ETFs. Do not add non-tech IBS legs."},{"h":131,"hstr":"H131","status":"NOT CONFIRMED","sharpe":"4.380","cagr":null,"maxdd":null,"cumul":null,"summary":"Adding shorter TSMOM filter to H026 sector ETF rotation","full":"NOT CONFIRMED — Adding shorter TSMOM filter to H026 sector ETF rotation. All variants (B: 3m only, C: 12m+3m dual, D: 12m+6m dual) hurt both OOS and AltOOS vs H130 baseline (12m only). Best attempt: B (3m only) OOS 22.5304 (Δ−0.7464), AltOOS 77.6906 (Δ−0.0926), Sharpe 4.380, MaxDD −5.1% (worse). C (12m+3m dual): OOS Δ−0.6549, AltOOS Δ−3.5821. D (12m+6m dual): OOS Δ−0.5149, AltOOS Δ−6.4471. Economics: sector ETF rotation has longer-duration trends than bond rate cycles or broad equity macro shocks — the 12m filter correctly captures multi-quarter sector rotation; adding 3m/6m creates whipsaw during normal intra-trend pullbacks. Confirms asymmetry: 3m TSMOM optimal for bonds (H045) and broad equities (H041a); 12m optimal for sector rotation (H026). Do not add shorter filter to H026."},{"h":130,"hstr":"H130","status":"CONFIRMED","sharpe":"4.553","cagr":null,"maxdd":null,"cumul":null,"summary":"3m TSMOM filter on H041a global equity rotation in full blend","full":"CONFIRMED — 3m TSMOM filter on H041a global equity rotation in full blend. B (3m>0): OOS 21.6336→23.2768 (+1.6432), AltOOS 71.5302→77.7832 (+6.2530), Sharpe 4.553→4.600, MaxDD −3.6%→−3.0%, NegYrs 0. D (12m+3m>0 dual): OOS +1.5422, AltOOS +6.2708, Sharpe 4.636 (best Sharpe), MaxDD −3.0%. Both B and D confirmed. H041a baseline only triggered 1 cash month in full period — very conservative filter. Deployed B (3m) to h112_monthly.py: H041a now has tsmom_filter=True, tsmom_lb=3. Economics: 2022 selloff and 2020 crash both caused brief broad equity downturns (all 19 ETFs negative) that benefited from going to cash. Unlike H023/H123 (12m filter on H041a failed), 3m filter responds faster to corrections and exits before momentum-based signal can react. Note: H041a is now consistent with H045 — both use 3m TSMOM. H026 keeps 12m (sector rotation has longer trends)."},{"h":129,"hstr":"H129","status":"NOT CONFIRMED","sharpe":"4.572","cagr":null,"maxdd":"-3.61%","cumul":null,"summary":"Weight re-opt post-H128","full":"NOT CONFIRMED — Weight re-opt post-H128. Pareto frontier persists. Phase 1 (H045 sweep, rotation=70% fixed): lower H045 → higher cumul but lower Sharpe. H045=0.28 has best Sharpe 4.572, H045=0.14 has best cumul 28.9455 — baseline 0.21 is the risk-adjusted optimum (Sharpe 4.553, MaxDD -3.61%). Phase 2 (h041a:h026 ratio): more H026 → higher AltOOS+OOS cumul but Sharpe drops from 4.553→4.367, MaxDD worsens -3.61%→-4.08%. \"Best\" h041a=17%/h026=39%/h045=14% gives OOS +13pp cumul but this is higher H026 risk concentration, not genuine alpha. Pattern identical to H108: increasing H026 always improves cumul but hurts Sharpe and MaxDD. Current 22%/27%/21% confirmed optimal for risk-adjusted returns. Do not change weights."},{"h":128,"hstr":"H128","status":"CONFIRMED","sharpe":"4.537","cagr":null,"maxdd":null,"cumul":null,"summary":"3m TSMOM filter on H045 in full H122 blend","full":"CONFIRMED — 3m TSMOM filter on H045 in full H122 blend. OOS 21.1645 → 21.6336 (+0.4691), AltOOS 69.8108 → 71.5302 (+1.7194), OOS Sharpe 4.537 → 4.553, MaxDD −3.6% (unchanged), NegYrs 0. Best variant B (3m>0 filter). Also confirmed: C (6m>0, +0.1762/+0.6213), D (dual 12m+6m>0, +0.1534/+0.6492). 12m filter alone (E) slightly hurts (−0.1270/−0.1006). H045 PROD universe (13 ETFs) in blend. Improvement smaller than standalone (0.4691 blend vs 33.68pp standalone) because H045 weight is 0.21 in blend. Deployed to h112_monthly.py: add 3m TSMOM filter to H045 rotation, hold only ETFs with 3m return > 0 (hold fewer or 0 if needed)."},{"h":127,"hstr":"H127","status":"CONFIRMED","sharpe":"1.351","cagr":null,"maxdd":null,"cumul":null,"summary":"MAJOR","full":"CONFIRMED — MAJOR. TSMOM filter on H045 bond ETF rotation. All 4 variants improve BOTH OOS and AltOOS. Best variant D (3m>0 filter): OOS +44.92% → +78.60% (+33.68pp), AltOOS +70.03% → +118.46% (+48.43pp), OOS Sharpe 1.351 → 2.370, MaxDD −6.28% → −0.98% (almost zero!), 14 cash months in OOS (13%). C (dual 12m+6m>0): OOS +63.81%, Sharpe 2.172, MaxDD −1.30%. Economic logic: bond momentum reverses faster than equity momentum — rate shocks resolve in months not years, so 3m absolute filter responds faster than 12m filter used in H026/H116. 12m filter on bonds is too slow; 3m filter exits early in rising-rate periods and re-enters quickly on recovery. All 4 variants: A(12m) OOS +45.51% Sharpe 1.418; B(6m) OOS +62.19% Sharpe 1.795; C(12m+6m) OOS +63.81% Sharpe 2.172; D(3m) OOS +78.60% Sharpe 2.370. Apply to H045 in production. Run H128 to verify in full H122 blend before deploying to h112_monthly.py."},{"h":126,"hstr":"H126","status":"NOT CONFIRMED","sharpe":"1.351","cagr":null,"maxdd":null,"cumul":null,"summary":"Bond ETF carry signal (yield-augmented H045 momentum). score = rank(12m_mom) + rank(inv_6m_vol) + W * rank(yield)","full":"NOT CONFIRMED — Bond ETF carry signal (yield-augmented H045 momentum). score = rank(12m_mom) + rank(inv_6m_vol) + W * rank(yield). All W variants worse on Sharpe: baseline OOS Sharpe 1.351 → 1.024 at W=0.5 (−0.327), MaxDD −6.28% → −10.52%. W=0.5 improves OOS cumul slightly (+44.92% → +49.64%, +4.72pp) but hurts AltOOS (70.03% → 60.37%, −9.66pp). No variant improves BOTH windows. Data limitation: BAMLH0A0HYM2EY (HYG) and BAMLC0A0CMEY (LQD) only available from 2023 on FRED — excluded from scoring 2007-2022. Economic reason: momentum already captures duration regime shifts; yield carry pushes toward longer-duration bonds, which get crushed in rising-rate regimes (2022). H045 momentum signal is explicitly designed for this. Do not add yield carry to H045."},{"h":125,"hstr":"H125","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Extended momentum lookbacks (18m, 24m)","full":"NOT CONFIRMED — Extended momentum lookbacks (18m, 24m). Every variant with longer lookbacks worse than baseline [3,6,12]. Best variant C (+18m): OOS 21.13 vs 23.40 (−2.27), AltOOS 66.23 vs 81.81 (−15.58). Full 6-term [3,6,12,18,24,36]: MaxDD −8.4%, far worse. Replacing 3m with 24m: OOS 11.00 (−12.40). The 3-6-12 spectrum is the optimal coverage for monthly ETF rotation — longer lookbacks add noise, not signal. The Novy-Marx (2012) 12-24m effect applies to individual stocks, not monthly-rebalanced ETF rotation. Confirmed [3,6,12] optimal. Do not add longer lookbacks."},{"h":124,"hstr":"H124","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"1-month reversal penalty in rank ensemble","full":"NOT CONFIRMED — 1-month reversal penalty in rank ensemble. Every weight W=0.25 to W=2.0 is dramatically worse than baseline. W=0.25 cuts OOS cumul from 23.40 to 13.13 (−44%), MaxDD worsens −3.5% → −5.1%. Skip-3m + W=1.0 even worse (OOS 1.34, NegYrs 4). Mechanism: 1m reversal effect is a microstructure artifact for individual stocks (bid-ask bounce, order imbalance) — absent for monthly-rebalanced ETFs. Applying reversal penalty partially cancels the 3m momentum signal since they overlap. Production signal (rank(3m)+rank(6m)+rank(12m)+rank(inv_vol), no reversal) confirmed optimal. Do not add reversal term."},{"h":123,"hstr":"H123","status":"NOT CONFIRMED","sharpe":"4.404","cagr":null,"maxdd":null,"cumul":null,"summary":"TSMOM filter variant sweep for H026 (and H041a)","full":"NOT CONFIRMED — TSMOM filter variant sweep for H026 (and H041a). Baseline A: 12m filter on H026 only (H122). All 6 variants worse on at least one OOS window. Key findings: (1) Shorter filters 6m/3m dramatically worsen MaxDD: −3.5% → −7.8% (shorter filter allows high-vol assets through at wrong time). (2) Dual-filter 12m+3m also loses OOS (23.88 vs 24.77). (3) Adding 12m filter to H041a: OOS 24.47 (−0.30), AltOOS 85.98 (−0.01) — marginally worse. (4) No filter at all: OOS Sharpe 4.404 but cumul only 15.70 vs 24.77 baseline — filter adds 57% more compounding. Production config (12m TSMOM on H026 only) is confirmed optimal. Do not change."},{"h":121,"hstr":"H121","status":"CONFIRMED","sharpe":"4.535","cagr":null,"maxdd":null,"cumul":null,"summary":"Vol-targeting on H026 only (variant D) on top of H120 rank ensemble","full":"CONFIRMED — Vol-targeting on H026 only (variant D) on top of H120 rank ensemble. Baseline H120: OOS 24.7717, AltOOS 85.9900. Best variant D (vol-target H026 only): OOS 27.8836 (+3.1119), AltOOS 103.5302 (+17.5402), OOS Sharpe 4.535, MaxDD −3.8%, NegYrs 0. Key: vol-targeting H026 alone outperforms targeting H041a+H026 (was best in H118). On the stronger rank ensemble signal, H026 is the one sub-strategy that benefits from vol scaling — its sector rotation concentration amplifies drawdowns when volatility spikes. Vol-targeting all three (B) dramatically hurts OOS (14.70 vs 24.77 baseline). Risk parity also hurts (9.72). NOTE: H121 absolute cumuls are higher than H119 — H121 uses production H120 formula (rank(3m)+rank(6m)+rank(12m)+rank(inv_vol)) while H119 double-ranked (rank(sum_of_ranks)+rank(inv_vol)); different formulae. H121 cumuls are the ground truth for H120 production. Implementation: monthly, scale H026 weight by (target_vol_h026 / realized_6m_vol_h026), clamp 0.5x–2x, renorm rotation total to 70%."},{"h":119,"hstr":"H119","status":"CONFIRMED","sharpe":"3.845","cagr":null,"maxdd":null,"cumul":null,"summary":"MAJOR","full":"CONFIRMED — MAJOR. Momentum rank ensemble (rank_3m+rank_6m+rank_12m). OOS 6.5635→8.4086 (+1.8451, +28%), AltOOS 14.9411→19.5157 (+4.5746, +30%), OOS Sharpe 3.845→4.376, MaxDD −3.6%→−2.4% (IMPROVED), NegYrs 0. This is the largest single improvement since H093/H104. Key: rank each lookback independently before adding — avoids scale dominance of 12m returns. TSMOM filter still uses 12m sign (unchanged). Simple blend (3m+6m+12m)/3 also confirmed but smaller: OOS +1.3951. 6m-only fails OOS window. Apply to production immediately as H120 upgrade. NOTE: H119 backtest uses double-ranking (rank(sum_of_ranks)+rank(vol)) — different from final H120 production formula."},{"h":118,"hstr":"H118","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Volatility-targeted weight scaling on H041a+H026 (variant E)","full":"CONFIRMED — Volatility-targeted weight scaling on H041a+H026 (variant E). OOS 6.5635→6.6539 (+0.0904), AltOOS 14.9411→15.3988 (+0.4577), MaxDD −3.6%→−3.5% (slight improvement), NegYrs 0. Key finding: vol-targeting H026 only (D) also confirmed (OOS +0.1193, AltOOS +0.3410). Vol-targeting ALL THREE (B) or risk parity (C) dramatically HURTS — OOS cumul drops to 5.02 and 4.13. Mechanism: H041a+H026 are equity alpha sources; scaling their weight by (target_vol/realized_6m_vol) reduces exposure during volatile periods. H045 must stay fixed (bonds provide diversification precisely when vol is high). VOL_WINDOW=6m, clamp 0.5x–2x. Pending: apply to production paper trading script (H119 upgrade)."},{"h":112,"hstr":"H112","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H026 +IBB+USO (biotech + crude oil)","full":"CONFIRMED — H026 +IBB+USO (biotech + crude oil). OOS 4.0940→4.1577 (+0.0637), AltOOS 4.0196→4.0612 (+0.0416), MaxDD −3.60% (unchanged), WF 3.024 (unchanged). +IBB alone ✓, +USO alone ✓, +IBB+USO BEST. XME (metals mining equity) ✗ — dilutes signal. H041a expansion ✗ (EWZ/EWC both fail). H026 now 25-asset."},{"h":111,"hstr":"H111","status":"CONFIRMED","sharpe":null,"cagr":"22.81%","maxdd":null,"cumul":null,"summary":"H026 +UNG+EWZ (natural gas + Brazil)","full":"CONFIRMED — H026 +UNG+EWZ (natural gas + Brazil). OOS 4.0724→4.0940 (+0.0216), AltOOS 3.9905→4.0196 (+0.0291), MaxDD −3.60% (unchanged), WF 3.024 (unchanged). CAGR 22.81%→23.11%. +EWZ alone ✓ (4.0940/4.0085), +UNG+EWZ BEST (4.0940/4.0196). EWZ = EM Americas equity signal; UNG = pure natural gas seasonality. H026 now 23-asset."},{"h":110,"hstr":"H110","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H041a top-N (19-asset) AND H045 top-3 (13-asset) BOTH fail","full":"NOT CONFIRMED — H041a top-N (19-asset) AND H045 top-3 (13-asset) BOTH fail. H041a top-2 OOS 3.8053 (−0.267 vs 4.0724), MaxDD −4.14% (MUCH worse). H045 top-3 OOS 4.0357 (−0.037). Pattern: top-1/top-2 concentration is optimal across all rotation components. Consistent with H096/H106."},{"h":109,"hstr":"H109","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H045 +PCY (Invesco EM Sovereign Debt)","full":"CONFIRMED — H045 +PCY (Invesco EM Sovereign Debt). OOS 4.0717→4.0724 (+0.0007), AltOOS 3.9901→3.9905 (+0.0004), MaxDD −3.60% (unchanged), WF 3.020→3.024. Marginal but dual-window confirmed. H045 now 13-asset: +PCY. Only winner of 14 candidates — H045 nearly saturated."},{"h":108,"hstr":"H108","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Weight re-opt post-H107","full":"NOT CONFIRMED — Weight re-opt post-H107. Phase 1 best at H026=31% (sum 8.0701), Phase 2 best at H041a=21%. Joint 21%/31%/18%: OOS 4.0688 (−0.0029), AltOOS 4.0019 (+0.0118), MaxDD −3.81% (WORSENS 21bp). Pareto frontier persists. 22%/27%/21% confirmed optimal again. Pattern: increasing H026 always improves AltOOS but drops OOS and MaxDD."},{"h":107,"hstr":"H107","status":"CONFIRMED","sharpe":null,"cagr":"22.19%","maxdd":null,"cumul":null,"summary":"H026 +GDX+DBA+SLV (gold miners + agriculture + silver)","full":"CONFIRMED — H026 +GDX+DBA+SLV (gold miners + agriculture + silver). OOS 3.9413→4.0717 (+0.1304 HUGE), AltOOS 3.9248→3.9901 (+0.0653), MaxDD −3.15%→−3.60% (WORSENS 45bp), WF 3.045→3.020. CAGR 22.19%→22.77%. +SLV alone ✓, +DBA+SLV ✓, +GDX+DBA+SLV BEST. H026 now 21-asset: +GDX+DBA+SLV. Full commodity complex assembled."},{"h":106,"hstr":"H106","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H026 top-N sweep (18-asset). top-2 OOS 3.8020 ✗; top-3 3.7941 ✗","full":"NOT CONFIRMED — H026 top-N sweep (18-asset). top-2 OOS 3.8020 ✗; top-3 3.7941 ✗. Both fail dual-window vs top-1 (3.9413/3.9248). H026 top-1 confirmed optimal on 18-asset universe. Pattern consistent with H096 (top-1 optimal on 14-asset)."},{"h":105,"hstr":"H105","status":"CONFIRMED","sharpe":null,"cagr":"20.65%","maxdd":null,"cumul":null,"summary":"Weight re-opt post-H104","full":"CONFIRMED — Weight re-opt post-H104. NEW WEIGHTS: H041a 22% / H026 27% / H045 21%. OOS 3.9361→3.9413 (+0.0052), AltOOS 3.8652→3.9248 (+0.0596), MaxDD −2.73%→−3.15% (WORSENS 42bp), WF 3.003→3.045. CAGR 20.65%→22.19% (+1.54pp!). H026 weight 18%→27% (H026+DBC+AGG stronger signal); H045 29%→21%. ZERO negative years."},{"h":104,"hstr":"H104","status":"CONFIRMED","sharpe":null,"cagr":"20.52%","maxdd":null,"cumul":null,"summary":"H026 +DBC+AGG (commodity basket + aggregate bond)","full":"CONFIRMED — H026 +DBC+AGG (commodity basket + aggregate bond). OOS 3.7943→3.9361 (+0.1418 HUGE), AltOOS 3.7699→3.8652 (+0.0953), MaxDD −3.04%→−2.73% (IMPROVED!), WF 2.929→3.003. CAGR 20.52%→20.65%. ZERO negative years. +DBC alone ✓ (3.9170/3.8576), +AGG alone ✓ (3.8083/3.7806), +DBC+AGG BEST (sum 7.8013). H026 now 18-asset: 11-sector+BIL+GLD+TLT+IEF+TIP+DBC+AGG."},{"h":103,"hstr":"H103","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Weight re-opt post-H102","full":"NOT CONFIRMED — Weight re-opt post-H102. H026 sweep (H041a=23%): OOS peaks at 16% (3.7967), AltOOS monotonically improves; best sum at 21% (7.5713). H041a sweep (H026=21%): best at 23-24%. Joint 24%/21%/25%: OOS 3.7846 (−0.0097), AltOOS 3.7872 (+0.0173), MaxDD −3.32% (worsens 28bp). Pareto tradeoff persists. 23%/18%/29% confirmed optimal."},{"h":102,"hstr":"H102","status":"CONFIRMED","sharpe":null,"cagr":"20.77%","maxdd":null,"cumul":null,"summary":"H026 expansion: +IEF+TIP (intermediate Treasuries + TIPS)","full":"CONFIRMED — H026 expansion: +IEF+TIP (intermediate Treasuries + TIPS). OOS 3.7580→3.7943 (+0.0363), AltO
