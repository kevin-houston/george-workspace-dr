 2.106 (+5.3%). Also: +IWM and +XLRE both show dual-window improvement but far smaller."},{"h":76,"hstr":"H076","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":"-3.91%","cumul":null,"summary":"IGV2 (H041a-) dual-window confirmed: OOS 2.6657→2.6951 (+0.0294), AltOOS 2.7054→2.7057 (+0.0003), WF worst 2.379 ✓, MaxDD -3.91% (improved from -4.08%)","full":"CONFIRMED — IGV2 (H041a-) dual-window confirmed: OOS 2.6657→2.6951 (+0.0294), AltOOS 2.7054→2.7057 (+0.0003), WF worst 2.379 ✓, MaxDD -3.91% (improved from -4.08%). Zero negative years maintained. 2% allocation sweet spot: 4% gives primary OOS +0.053 but AltOOS -0.007; 2% gives both windows positive. 2013-2017 drag halved vs 4% (max -0.62pp vs -1.24pp). NEW PRODUCTION: H041a 20.6% / H026 6.4% / H045 43% / XLK 20% / SMH 8% / IGV 2%."},{"h":75,"hstr":"H075","status":"PARTIAL","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"LY CONFIRMED — IGV4 (H041a-) primary OOS +0.053 (2.6657→2.7186) but AltOOS marginally -0.007 (2.7054→2.6982)","full":"PARTIALLY CONFIRMED — IGV4 (H041a-) primary OOS +0.053 (2.6657→2.7186) but AltOOS marginally -0.007 (2.7054→2.6982). Zero negative years maintained. MaxDD improves -4.08%→-3.74%. WF worst 2.358 ✓. IGV standalone: primary deg +130%, alt deg +54% (genuine edge in both IS windows). Calendar drag 2013-2017: -0.7 to -1.2pp/yr (software intraday vol not yet extreme pre-2018). Post-2018 benefit: 2022 +1.62pp. Investigating IGV at 2% in H076."},{"h":74,"hstr":"H074","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"IGV IBS sweep: best buy=0.30/sell=0.75/hold=5/gap=+0.25% → OOS 1.442 (IS 0.627), Deg +130%","full":"CONFIRMED (IGV edge established) — IGV IBS sweep: best buy=0.30/sell=0.75/hold=5/gap=+0.25% → OOS 1.442 (IS 0.627), Deg +130%. Positive gap (≠ XLK/SMH negative gap) — software gapped-up-but-low-IBS signal. Portfolio IGV4 (H041a-): OOS +0.053, WF 2.358 ✓. NOTE: H041a=SPY/QQQ/TLT/GLD/IEF/EFA/EEM top-2; H026=11-sector top-3 (corrected from earlier wrong assumptions)."},{"h":73,"hstr":"H073","status":"CONFIRMED","sharpe":null,"cagr":"15.01%","maxdd":null,"cumul":null,"summary":"Full cross-validation of BKLN+EMB H045 expansion","full":"CONFIRMED — Full cross-validation of BKLN+EMB H045 expansion. Both OOS windows confirm on both additions. BKLN+EMB: OOS 2.6657 (+0.1162 vs H070), AltOOS 2.7054 (+0.1291), WF worst 2.394 ✓. OOS CAGR 15.01% (+0.24pp), MaxDD −4.08% (−0.63pp better). ZERO negative years 2004-2025 maintained. 2022: +5.12% (BKLN correctly selected in rate-hike cycle). New production H045 universe: SHY+IEI+IEF+TLT+TIP+HYG+LQD+BKLN+EMB (9-asset, top-2)."},{"h":72,"hstr":"H072","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H045 universe expansion with BKLN (floating-rate, zero duration) and EMB (EM bonds)","full":"CONFIRMED — H045 universe expansion with BKLN (floating-rate, zero duration) and EMB (EM bonds). H045 standalone: base-7 OOS 1.292 → BKLN+EMB OOS 1.631 (+26%!). Portfolio BKLN+EMB: OOS 2.666 (+0.116 vs H070 2.550), AltOOS 2.705, WF 2.394 ✓. Key mechanism: in 2022 rate hike cycle BKLN returned +0.45% (TLT −31.5%, IEF −16%) — momentum signal correctly selected floating-rate over duration. Both OOS windows confirm → NOT overfit. BKLN+EMB adopted as new H045 universe."},{"h":71,"hstr":"H071","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Commodity IBS satellites don't reliably improve the H070 portfolio","full":"INCONCLUSIVE — Commodity IBS satellites don't reliably improve the H070 portfolio. GLD IBS: best params OOS 1.342 but IS 0.065 (near-zero) — all configurations show IS near-zero, likely 2018-2026 gold bull market artifact. GDX IBS: best params OOS 0.944 (IS 0.305 more balanced), but portfolio WF worst drops to 1.868 with GDX4. Best variant GLD4 (H041a-): OOS 2.617 vs baseline 2.550 but WF worst 2.065 (down from 2.374) and AltOOS improvement marginal (+0.002). H070 baseline remains production standard."},{"h":70,"hstr":"H070","status":"CONFIRMED","sharpe":null,"cagr":"14.77%","maxdd":"-4.71%","cumul":null,"summary":"Both OOS windows validate H069 parameter improvements (NOT overfit)","full":"CONFIRMED — Both OOS windows validate H069 parameter improvements (NOT overfit). Primary OOS: 2.379→2.550 (+7.2%), Alt OOS: 2.474→2.576 (+4.1%). New production: XLK buy=0.15/sell=0.90/hold=7/gap=-1.0%; SMH buy=0.20/sell=0.75/hold=6/gap=-0.5%. OOS CAGR 14.77% (+2.1pp), MaxDD -4.71%. Zero negative years maintained 2004-2025. 2020: +26.8% vs baseline +18.4%. 2022: +4.54% vs baseline +5.87% (tradeoff acceptable). Fine-grid confirms buy=0.15/sell=0.90/hold=7/gap=-1.0% is XLK optimum."},{"h":69,"hstr":"H069","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"SPY-optimized IBS params suboptimal for tech ETFs","full":"CONFIRMED (key insight) — SPY-optimized IBS params suboptimal for tech ETFs. XLK optimal: buy=0.15/sell=0.90/hold=7/gap=-1.0%; SMH optimal: buy=0.20/sell=0.75/hold=6/gap=-0.5%. Portfolio OOS 2.379→2.550 (+7.2%, WF worst 2.374 ✓). Intuition: XLK bounces to IBS 0.90 over 7 days; SMH more volatile, exit at IBS 0.75 in 6 days. XLK and SMH have OPPOSITE optimal exit thresholds — different mean-reversion speed."},{"h":68,"hstr":"H068","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"H045 upper bound extends through the full feasible range; EFA IBS adds no value","full":"CONFIRMED — H045 upper bound extends through the full feasible range; EFA IBS adds no value. Part 1: All H045 47%-62% pass WF (worst 2.356→2.041) — the WF constraint never binds. OOS Sharpe peaks near 46-47% but IS Sharpe declining as equity components shrink. Part 2: EFA IBS in all 5 blend configurations HURTS portfolio OOS Sharpe vs baseline (2.318-2.342 vs 2.379). Baseline XLK 20%+SMH 8% dominates every EFA variant. Conclusion: H067 winner (H045=43%, OOS 2.379, WF worst 2.401) confirmed as optimal production configuration — no benefit from EFA addition or higher H045."},{"h":67,"hstr":"H067","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"XLK+SMH IBS eliminates the H045 upper bound constraint","full":"CONFIRMED — XLK+SMH IBS eliminates the H045 upper bound constraint. All H045 values 34%-46% pass WF (worst 2.370-2.401, all >> 1.75). WF worst peaks at 43% (2.401). OOS Sharpe monotonically increases from 2.365 (34%) to 2.380 (46%) — flat above 43%. Production upgrade: H045 39% → 43%. New production: H041a 22.6% / H026 6.4% / H045 43% / XLK 20% / SMH 8%. OOS 2.379, WF worst 2.401, MaxDD −3.38%."},{"h":66,"hstr":"H066","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Full cross-validation of H065 finalists (F1: XLK24+SMH8 at 32%, F2: XLK20+SMH8 at 28%)","full":"CONFIRMED — Full cross-validation of H065 finalists (F1: XLK24+SMH8 at 32%, F2: XLK20+SMH8 at 28%). Primary OOS: F1 2.387, F2 2.374. Alt OOS (2013-2026): F1 2.471, F2 2.487. F2 WF worst 2.395 vs F1 2.222. F2 selected as production (better alternate OOS and WF consistency). ZERO negative calendar years 2004-2025 for both variants. 2022 defensive: H060 +7.83%, F1 +7.61%, F2 +5.87%. Alt IS (2003-2012): F2 1.963, F1 1.956. H060 (QQQ baseline) strictly dominated on every long-term metric."},{"h":65,"hstr":"H065","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Fine-grid XLK/SMH split at 28% and 32% total IBS","full":"CONFIRMED (F2 selected via H066) — Fine-grid XLK/SMH split at 28% and 32% total IBS. F2 (XLK20+SMH8 at 28%) chosen over F1 (XLK24+SMH8 at 32%) due to better WF consistency (2.395 vs 2.222) and better alternate OOS (2.487 vs 2.471). All combinations with XLK dominant and 8% SMH pass WF. SMH-only fail WF badly. QQQ fully replaced by XLK+SMH blend."},{"h":64,"hstr":"H064","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"XLK IBS strictly dominates QQQ IBS: IS 0.881 vs 0.801, OOS 1.613 vs 1.472","full":"CONFIRMED (key insight) — XLK IBS strictly dominates QQQ IBS: IS 0.881 vs 0.801, OOS 1.613 vs 1.472. H060 baseline (QQQ 28%): OOS 2.192, WF worst 1.726 (just below threshold). XLK 28% alone: OOS 2.328, WF worst 2.351 ✓. XLK 20%+SMH 8% (F): OOS 2.374, WF worst 2.395 ✓ — best WF consistency. All non-QQQ variants beat H060 on OOS Sharpe. QQQ deprecated. Critical fix: H041a/H026/H045 all use rank(12m_mom)+rank(inv_6m_vol) composite signal — not 1-month momentum. Corrected reconstruction gives H045 IS 1.607 / OOS 1.292, H041a IS 1.619 / OOS 1.821, H026 IS 1.495 / OOS 1.518."},{"h":63,"hstr":"H063","status":"PARTIAL","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Initial reconstruction had wrong signal (1-month momentum) for H041a/H026/H045, making H045 OOS Sharpe appear as 0.216","full":"PRELIMINARY (corrected in H064) — Initial reconstruction had wrong signal (1-month momentum) for H041a/H026/H045, making H045 OOS Sharpe appear as 0.216. Fixed in H064."},{"h":62,"hstr":"H062","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"Multi-asset IBS survey over 10 ETFs. 5 assets show inverse degradation (OOS > IS): XLK OOS 1.613 Deg +83%, QQQ OOS 1.472 Deg +84%, SMH OOS 1.417 Deg +171%, EFA OOS 0.764 Deg +56...","full":"CONFIRMED — Multi-asset IBS survey over 10 ETFs. 5 assets show inverse degradation (OOS > IS): XLK OOS 1.613 Deg +83%, QQQ OOS 1.472 Deg +84%, SMH OOS 1.417 Deg +171%, EFA OOS 0.764 Deg +56%, GDX OOS 0.725 Deg +203%. 4 degrade: SPY −39%, TLT −34%, IWM −31%, XLE −100%. Correlation of IBS returns to QQQ: XLK +0.784 (high), SMH +0.592 (moderate), GLD +0.091 (low diversifier), GDX −0.117 (low diversifier). Best 50/50 blend with QQQ: QQQ+XLK OOS 1.623, QQQ+SMH OOS 1.607, QQQ+GLD OOS 1.590. Key finding: IBS inverse degradation is concentrated in tech/semiconductor sector — high intraday vol post-2018 creates stronger mean-reversion signal. QQQ and XLK have same +83% OOS improvement rate; SMH has +171% (most dramatically improving)."},{"h":61,"hstr":"H061","status":"CONFIRMED","sharpe":"2.271","cagr":null,"maxdd":null,"cumul":null,"summary":"Production portfolio doubly validated","full":"CONFIRMED — Production portfolio doubly validated. H026 marginal contribution +0.0008 OOS Sharpe (negligible at 7.3% weight) — keep for minor diversification. Alternate OOS (2013-2026, 13yr): H060 OOS Sharpe 2.271 with +12.5% positive degradation. Zero negative years 2013-2025. Correlation matrix: H041a/H045=0.473 (overlap via TLT/IEF in risk-off), H054b/H045=−0.096 (the core anchor pair), H026/H054b=0.378 (unexpected, both partially capture equity bounce dynamics). H060 is the strongest portfolio in the programme on both primary and alternate OOS splits."},{"h":60,"hstr":"H060","status":"CONFIRMED","sharpe":"2.1314","cagr":"11.28%","maxdd":null,"cumul":null,"summary":"Definitive production portfolio: H041a 25.7% / H026 7.3% / H054b 28% / H045 39%","full":"CONFIRMED — Definitive production portfolio: H041a 25.7% / H026 7.3% / H054b 28% / H045 39%. OOS Sharpe 2.1314, OOS MaxDD −2.83%, OOS CAGR 11.28%, WF worst 1.756 (above 1.75 threshold). H045=39% is the upper bound (40% fails WF). Extended 2003-2026 Sharpe 2.1595, CAGR 10.51%, MaxDD −4.56%. ZERO negative years in 23 years (2003-2025). 2008: +10.5%, 2022: +7.3% — extraordinary tail protection. This is the most validated portfolio in the programme."},{"h":59,"hstr":"H059","status":"CONFIRMED","sharpe":"2.1114","cagr":"11.7%","maxdd":null,"cumul":null,"summary":"WF-consistent winner: H041a 28.8% / H026 8.2% / H054b 28% / H045 35%","full":"CONFIRMED — WF-consistent winner: H041a 28.8% / H026 8.2% / H054b 28% / H045 35%. OOS Sharpe 2.1114 (+0.13 vs H057), OOS MaxDD −3.00%, OOS CAGR 11.7%, Deg +5.0%. WF: avg 2.845 ±0.827, worst fold 1.806 (above 1.75 threshold). All H054b=32% allocations fail WF threshold (worst fold 1.51-1.64). H054b=28% is the maximum IBS allocation that maintains WF consistency. This is the new production portfolio — H041a+H026 shrinks from 57.6% to 37% (equity → low-correlation components). H060 will validate on extended 2003-2026 window and test whether H045 can be pushed beyond 35%."},{"h":58,"hstr":"H058","status":"CONFIRMED","sharpe":null,"cagr":"11.2%","maxdd":null,"cumul":null,"summary":"2D grid: OOS Sharpe improves monotonically as H054b and H045 both increase","full":"CONFIRMED (partial) — 2D grid: OOS Sharpe improves monotonically as H054b and H045 both increase. Best OOS: H054b=32%/H045=40% → OOS 2.1453, MaxDD −3.06%, CAGR 11.2%, Deg +12.1%. BUT walk-forward reveals WF worst-fold drops to 1.413 (vs H057's 2.167) in the 2014-2015 Fold 2 period, suggesting the aggressive allocation is regime-dependent. Moderate allocations (H054b=24-28%/H045=25-30%) likely offer better WF consistency at OOS 2.05-2.09. H059 will test intermediate points with full WF to find the WF-consistent Pareto frontier."},{"h":57,"hstr":"H057","status":"CONFIRMED","sharpe":"1.9925","cagr":"13.23%","maxdd":null,"cumul":null,"summary":"H041a 44.8% / H026 12.8% / H054b 22.4% / H045 20.0% (H037b eliminated)","full":"CONFIRMED — H041a 44.8% / H026 12.8% / H054b 22.4% / H045 20.0% (H037b eliminated). Full Sharpe 1.9925, IS 1.9986, OOS 1.9829, OOS MaxDD −4.27%, OOS CAGR 13.23%, degradation −0.8%. Component OOS: H041a −3.8%, H026 −2.6%, H054b +93.4%, H045 −21.9% — H054b inverse degradation masks all other degradation. H054b grid: OOS improves monotonically to H054b=36% (OOS 2.0704). H045 grid: OOS improves monotonically to H045=40% (OOS 2.0897). Walk-forward: avg OOS 2.924 ±0.822, worst fold 2.167 (NO catastrophic folds). Both H054b and H045 can be pushed further — H058 will test the 2D joint grid."},{"h":56,"hstr":"H056","status":"CONFIRMED","sharpe":"1.9463","cagr":null,"maxdd":null,"cumul":null,"summary":"IBS weight grid proves H037b (SPY IBS) should be ELIMINATED","full":"CONFIRMED (DECISIVE) — IBS weight grid proves H037b (SPY IBS) should be ELIMINATED. H037b=0%/H054b=28% achieves OOS Sharpe 1.9463 (+3.9% POSITIVE degradation) vs H042's H037b=28% at 1.6546 (−20.2%). Each 4% shift from H037b→H054b monotonically raises OOS Sharpe and reduces OOS degradation. With H045=20% fixed: H037b=0%/H054b=22.4% achieves OOS Sharpe 1.9829, MaxDD −4.27%, degradation −0.8%. Walk-forward on H055 (56/16/14/14 + H045 20%): avg OOS 2.2098 ±0.3938, WF deg +21.4% (OOS exceeds IS!), worst fold 1.726. New optimal 5-way portfolio: H041a 44.8% / H026 12.8% / H054b 22.4% / H045 20.0% — H037b dropped completely. H057 will formally validate this portfolio."},{"h":55,"hstr":"H055","status":"CONFIRMED","sharpe":"1.8288","cagr":null,"maxdd":"-7.15%","cumul":null,"summary":"Splitting H037b allocation between SPY + QQQ IBS dramatically improves OOS robustness","full":"CONFIRMED (MAJOR FINDING) — Splitting H037b allocation between SPY + QQQ IBS dramatically improves OOS robustness. H055 (H041a 56 / H026 16 / H037b 14 / H054b 14): Full Sharpe 1.9314, IS Sharpe 2.0253, OOS Sharpe 1.8288, OOS degradation -9.7% vs H042's -20.2%. OOS MaxDD -7.15% vs H042's -8.79%. H055b (+H045 20%): Full Sharpe 2.0082, IS 2.1375, OOS 1.8717, degradation -12.4%, MaxDD -4.90%. H055b beats H052@20% OOS by +0.164 (1.8717 vs 1.7078). Key mechanism: H054b (QQQ IBS) IS Sharpe 0.761 → OOS 1.472 (+93% improvement) OFFSETS H037b's IS 1.438 → OOS 0.873 (-39%) degradation. Monthly corr H037b/H054b = 0.50 (borderline diversifying). The split creates a \"degradation hedge\" — when H037b's edge fades post-2018, H054b's edge is strengthening. H055 now has -9.7% OOS degradation comparable to H042's legendary -9.3% (measured on its own IS window). H055b is the new best OOS-validated portfolio in the research programme."},{"h":54,"hstr":"H054","status":"CONFIRMED","sharpe":"1.472","cagr":"11.73%","maxdd":"-15.87%","cumul":null,"summary":"QQQ IBS (H054b, -0.5% gap filter) adds meaningful diversification to H037b (SPY IBS)","full":"CONFIRMED — QQQ IBS (H054b, -0.5% gap filter) adds meaningful diversification to H037b (SPY IBS). Standalone H054b: Sharpe 1.0565, CAGR 11.73%, MaxDD -15.87%, 700 trades, WinRate 60.7%. Critical OOS finding: IS Sharpe 0.831 → OOS Sharpe 1.472 (+77% improvement, INVERSE degradation). H037b: IS 1.350 → OOS 0.873 (-35% degradation). Monthly corr H054b vs H037b: 0.490 (just below 0.50 threshold). OOS correlation 0.5635. Gap filter helps MaxDD: H054a unfiltered MaxDD -26.53%, H054b -0.5% filter MaxDD -15.87% (dramatic improvement). Blend benefit confirmed: 50/50 blend Sharpe 1.279 vs max standalone 1.125. H054c (-1.0% filter): Sharpe 1.045, MaxDD -15.36% — marginal vs H054b. Key insight: QQQ IBS fires on tech-sector-specific stress days not captured by SPY IBS; post-2018 QQQ's larger intraday swings made the signal MORE reliable. This is the direct complement to H037b's fading edge."},{"h":53,"hstr":"H053","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"SPY 200MA regime filter on H041a hurts performance","full":"REJECTED — SPY 200MA regime filter on H041a hurts performance. Full Sharpe drops 1.665→1.543 (-0.121). MaxDD WORSENS: -13.74%→-17.00%. OOS especially damning: H041a OOS 1.522 vs H053 OOS 1.213 (-0.310 delta). Root cause: H041a's momentum signal is already a BETTER regime filter — in risk-off months H041a's momentum score naturally selects bonds/gold/IEF. The 200MA filter replaces good endogenous risk management with a static IEF allocation, destroying alpha. H041a annualized return in risk-off months was 4.72% (positive!) vs risk-on 16.70% — filter fires into profitable months. IS (2003-2017) marginally better (+0.031 delta) because GFC 2008-2009 is the dominant risk-off period; OOS (2018-2026) much worse because post-COVID recovery was blocked. Conclusion: H041a's endogenous risk management is sufficient — no external MA overlay needed."},{"h":52,"hstr":"H052","status":"PARTIAL","sharpe":"1.708.","cagr":"13.6%","maxdd":"-6.52%","cumul":null,"summary":"LY CONFIRMED — H045 addition improves OOS Sharpe at every allocation tested","full":"PARTIALLY CONFIRMED — H045 addition improves OOS Sharpe at every allocation tested. IS/OOS split: 2008-01→2017-12 (IS) / 2018-01→2026-04 (OOS). On this split H042 baseline (H045=0%) shows IS 2.073/OOS 1.655/deg -20.2%. Adding H045: H045=10%→OOS 1.680, H045=20%→OOS 1.708, H045=25%→OOS 1.722, H045=30%→OOS 1.736, H045=40%→OOS 1.763, H045=50%→OOS 1.785. Each 10% H045 adds +0.026 OOS Sharpe — consistent with H047 marginal analysis (+0.04 per 10%). H045=20% is the practical sweet spot: Full Sharpe 1.943, CAGR 13.6%, MaxDD -6.52%, OOS Sharpe 1.708. At H045=30%: Full Sharpe 1.984 (matching H047 recommended blend), OOS 1.736, MaxDD -6.16%. Degradation increases from -20.2% to -23.6% as H045 grows — H045 addition does NOT worsen degradation materially (same IS window, same IS/OOS split). MaxDD shrinks monotonically from -8.79% → -5.92% as H045 grows. Note: these degradation figures are not directly comparable to H043 (-9.3%) because H043 used IS 2003-2016 (longer IS window); on 2008-2017 IS, H042 itself degrades -20.2%. Practical recommendation: H045=20-30% is the OOS-validated sweet spot."},{"h":51,"hstr":"H051","status":"PARTIAL","sharpe":"1.460","cagr":null,"maxdd":null,"cumul":null,"summary":"LY CONFIRMED (better than H047) — IS/OOS validation of H050 two-component portfolio (H045 82%/H037b 18%)","full":"PARTIALLY CONFIRMED (better than H047) — IS/OOS validation of H050 two-component portfolio (H045 82%/H037b 18%). IS 2008-01→2017-12 (120m) / OOS 2018-01→2026-04 (100m). Correlations: Full 0.0102, IS +0.1203, OOS -0.0927 (near-zero holds across periods). IS-optimal weights: H045=80%/H037b=20% (very close to full-period 82/18 — robust signal). IS Sharpe (IS-optimal): 2.115. OOS Sharpe (IS-optimal): 1.681. OOS Sharpe (full 82/18): 1.692. Degradation: -20.5% (IS-optimal), -11.5% (full-period weights vs full-period Sharpe). Critical comparison: BETTER than H047 (20.5% vs 23.8% degradation). Walk-forward: avg OOS 1.722 ± 0.186 (4 folds), avg degradation -22.8%. KEY: WF std dev 0.186 vs H047's 0.888 — vastly more consistent. Worst fold OOS Sharpe: 1.460 vs H047's catastrophic 0.613 (fold 4). Component OOS: H045 IS→OOS -21.9%, H037b IS→OOS -39.3%. H037b degradation consistent with H049 (-39.5%). MaxDD only -3.38% at 82/18 throughout. The 2-component simplicity delivers BETTER tail robustness (no catastrophic fold collapse). If H037b edge fades further, the 82% H045 allocation provides a strong anchor. Verdict: H050 passes OOS threshold (1.69 OOS Sharpe) with better worst-case robustness than the more complex H047."},{"h":50,"hstr":"H050","status":"CONFIRMED","sharpe":"1.5163","cagr":"6.47%","maxdd":"-6.28%","cumul":null,"summary":"Minimal two-component portfolio (H045 + H037b), 2008-01→2026-03 (219 months)","full":"CONFIRMED (EXTRAORDINARY) — Minimal two-component portfolio (H045 + H037b), 2008-01→2026-03 (219 months). Actual correlation: 0.0105 (near-zero confirmed). Standalone: H045 Sharpe 1.5163 / MaxDD -6.28%, H037b Sharpe 1.1464 / MaxDD -21.74%. Theoretical upper bound: sqrt(1.516²+1.146²)=1.9009. Fine-grained max-Sharpe blend: H045=82% / H037b=18% → Sharpe 1.9109, CAGR 6.47%, MaxDD -3.38%, AnnVol 3.38%. Achievement: 100.5% of theoretical upper (blending efficiency essentially perfect due to near-zero corr). Min-MaxDD blend: H045=76% / H037b=24% → MaxDD -2.75%, Sharpe 1.8812, CAGR 6.97%. 50/50 blend: Sharpe 1.5364, MaxDD -8.76%. H050 max-Sharpe EXCEEDS H042 (Sharpe 1.8674) by +0.0435. H047 (4-way, Sharpe 2.1128) still leads by 0.20 — the additional components in H047 do add value. Key insight: 0.01 correlation is so extreme that sqrt(S1²+S2²) is achieved in practice. H045's MaxDD (-6.28%) anchors the blend: at 80/20 the MaxDD is only -3.16% vs H037b's -21.74% standalone. Each 10% shift toward H037b adds ~1.5% CAGR but costs ~0.7% on MaxDD (the vol dominance of H037b over H045 means a small allocation goes a long way). The 2-component simplicity is remarkable — H050 beats the 3-component H042 with fewer moving parts."},{"h":49,"hstr":"H049","status":"PARTIAL","sharpe":"2.067","cagr":null,"maxdd":null,"cumul":null,"summary":"IS/OOS validation of H047 four-component blend (H041a 39.2% / H026 11.2% / H037b 19.6% / H045 30%)","full":"MODERATE OVERFIT WARNING (investable) — IS/OOS validation of H047 four-component blend (H041a 39.2% / H026 11.2% / H037b 19.6% / H045 30%). IS 2008-2017 (120m) / OOS 2018-2026 (99m). IS Sharpe (op weights): 2.2299. OOS Sharpe (op weights): 1.699. Degradation (op weights): -23.8% vs H042 benchmark -9.3%. IS Sharpe (IS-optimal): 2.4617 with H045=65%, H037b=15%, H041a=10%, H026=10%. OOS Sharpe (IS-optimal): 1.7427. Degradation (IS-optimal): -29.2% vs H042 benchmark -22.4%. Walk-forward avg OOS Sharpe: 2.067 ± 0.888 (5 folds); avg degradation -11.5%. Critical Fold 4 (2021-2023 test): OOS Sharpe collapsed to 0.613 — the 2021-2023 bull run after COVID recovery was the hardest environment. 2022 stress: blend -1.2% (H041a -6.7%, H026 -7.7%, H037b +21.0%, H045 -5.4%). H045 held SHY+TIP all of 2022 — the Treasury rotation correctly avoided duration but TIP still lost; H037b (+21%) was the real 2022 hero. Component OOS degradation: H041a -6.6%, H026 -4.8%, H037b -39.5%, H045 -23.2% — H037b is the overfit concern (IBS mean-reversion likely weakening). The -23.8% operating-weight degradation (vs H042's -9.3%) means H047 IS more fit to pre-2018 conditions. Expected real-world OOS Sharpe: ~1.70. The blend remains investable but headline Sharpe 1.984 should be haircut to ~1.70 for sizing. Operating weights (39.2/11.2/19.6/30) are preferred over IS-optimal (they generalize better in walk-forward)."},{"h":47,"hstr":"H047","status":"CONFIRMED","sharpe":"1.8674","cagr":"14.70%","maxdd":"-9.02%","cumul":null,"summary":"H045 addition meaningfully improves H042","full":"CONFIRMED — H045 addition meaningfully improves H042. Common window 2008-01→2026-04 (220 months). H042 baseline (56/16/28, H045=0%): Sharpe 1.8674, CAGR 14.70%, MaxDD -9.02%. H045 proportion grid: H045=10% → Sharpe 1.9036 (+0.036), H045=20% → 1.9429 (+0.076), H045=30% → 1.9841 (+0.117), H045=40% → 2.0249 (+0.158). Each increment of H045 raises Sharpe monotonically while cutting MaxDD and CAGR. H045 marginal dSharpe/dw: +0.38 to +0.42 across all grid points (consistently the strongest marginal contributor). Unconstrained 4-way max-Sharpe: H041a=12%, H026=8%, H037b=14%, H045=66% → Sharpe 2.1128, CAGR 8.23%, MaxDD -5.06%. Min-MaxDD 4-way: H041a=0%, H026=0%, H037b=24%, H045=76% → MaxDD -2.75%, Sharpe 1.889. Key correlations: H041a/H045=0.473, H026/H045=0.125, H037b/H045=0.010 — H045 is near-orthogonal to H037b (corr 0.01) — maximum diversification against IBS component. Trade-off: each 10% of H045 costs ~1% CAGR but adds ~0.04 Sharpe. Practical recommended blend: 56/16/28 H042 bundle × 70% + H045 × 30% → Sharpe 1.984, CAGR 11.76%, MaxDD -6.63%."},{"h":46,"hstr":"H046","status":"PARTIAL","sharpe":"0.8165","cagr":"8.98%","maxdd":"-21.90%","cumul":null,"summary":"LY CONFIRMED — IBS effect generalizes to sector ETFs but with meaningful caveats","full":"PARTIALLY CONFIRMED — IBS effect generalizes to sector ETFs but with meaningful caveats. H046 (5-sector, 20% each): Full Sharpe 0.9039 CAGR 8.98% MaxDD -21.90%, OOS Sharpe 0.8165 CAGR 7.37%. Per-sector: XLK best (Sharpe implied: WinRate 65.8%, AvgPnL 0.47%), XLE weakest (58.8% WinRate). Total 3141 trades full / 1237 OOS. Correlation to H037b (SPY) = 0.61 monthly — medium, not low enough for strong diversification. H046b (top-3 momentum sectors): Sharpe 0.831 CAGR 6.05% MaxDD -11.14% — lower drawdown but lower CAGR. Key findings: (1) IBS signal does work on all 5 sectors — all sectors show positive AvgPnL; (2) the correlation to H037b SPY is 0.61 because sector ETFs and SPY tend to bounce together on the same market-stress days; (3) 50/50 blend of H046+H037b shows monthly Sharpe 1.263 vs H046 alone 1.153 and H037b alone 1.124 — blend benefit +0.110 is real but modest; (4) H046 standalone Sharpe (0.90) trails H037b SPY (1.02) — sectors are noisier than SPY for IBS signal; (5) XLK has the best risk-adjusted profile for IBS (XLK also leads H026 frequency). Conclusion: H046 is not a replacement for H037b but could add marginal value as a supplement in a larger blend; the 0.61 correlation makes it less useful than hoped. Not recommended as standalone addition to H042."},{"h":45,"hstr":"H045","status":"CONFIRMED","sharpe":"1.351","cagr":"4.88%","maxdd":"-6.28%","cumul":null,"summary":"Treasury ETF momentum rotation (SHY/IEI/IEF/TLT/TIP/HYG/LQD, top-2 monthly)","full":"CONFIRMED — Treasury ETF momentum rotation (SHY/IEI/IEF/TLT/TIP/HYG/LQD, top-2 monthly). Full: Sharpe 1.505, CAGR 4.88%, MaxDD -6.28%, AnnVol 3.24%. IS Sharpe 1.681 / OOS Sharpe 1.351 (OOS Sharpe alpha vs AGG: +0.985). AGG B&H full Sharpe 0.672, MaxDD -17.13%. TLT held only 0.9% of months (never dominates — the hypothesis was partially wrong: SHY dominates at 61.8%, not TLT). In 2022 rate hike: SHY 100% + TIP (correct rotation). HYG grew from 25.9% IS → 48% OOS. Corr to H041a: 0.475 (moderate — partial diversifier but not enough to be a 4th H042 component without further testing). MaxDD only -6.28% vs -17% AGG — bond momentum dramatically cuts drawdown."},{"h":44,"hstr":"H044","status":"CONFIRMED","sharpe":"1.540","cagr":"14.44%","maxdd":"-15.77%","cumul":null,"summary":"Volatility targeting on H042","full":"CONFIRMED (qualified) — Volatility targeting on H042. Daily framework: H042 daily baseline Sharpe 1.540, MaxDD -15.77%, AnnVol 9.52%. Target 8%: Sharpe 1.633 (+0.093), MaxDD -13.45%, CAGR 14.44% — best risk-adjusted, net negative CAGR effect. Target 10%: Sharpe 1.561 (+0.021), MaxDD -14.85%, CAGR 16.44% — levered up CAGR +1.78pp. Target 12%: Sharpe 1.488 (-0.052), MaxDD -17.66%, CAGR 17.67%. Regime finding: vol targeting HURTS Sharpe in ALL regimes tested (high-vol and low-vol alike) — the lagged EWM vol estimate causes scale-up in high-vol periods and over-levers in quiet periods. Scale_cap=1.5 hit frequently (25% of days at 10% target). Conclusion: 8% target is the only variant that strictly improves both Sharpe and MaxDD; the 10% and 12% targets trade Sharpe for CAGR. Note: daily Sharpe (1.540) vs monthly Sharpe (1.949) gap is expected — daily zero-return days inflate daily vol denominator."},{"h":43,"hstr":"H043","status":"PARTIAL","sharpe":"1.768","cagr":"14.08%","maxdd":"-11.43%","cumul":null,"summary":"OOS Sharpe remains investable","full":"MODERATE overfit risk — OOS Sharpe remains investable. IS-optimal weights (42/22/36) applied to OOS: Sharpe 1.6653, CAGR 14.08%, MaxDD -11.43%. Full-period weights (56/16/28) applied to OOS: Sharpe 1.7680, CAGR 14.31%, MaxDD -8.79%. IS Sharpe (IS-optimal): 2.1452. Degradation: IS-optimal weights -22.4%, full-period weights -9.3% (similar to H020's 6.7%). Walk-forward avg OOS Sharpe: 1.768 ± 0.707 (4 folds), WF degradation -20.2%. Verdict: H042's edge is REAL but partially fit; the 56/16/28 weights applied to OOS are more stable than IS-re-optimized weights, suggesting they generalize better. OOS Sharpe 1.768 is investable and well above SPY."},{"h":42,"hstr":"H042","status":"CONFIRMED","sharpe":"1.9492","cagr":null,"maxdd":"-9.02%","cumul":null,"summary":"H041a upgrade improves H031b","full":"CONFIRMED — H041a upgrade improves H031b. Max-Sharpe blend 56/16/28 (H041a/H026/H037b): Sharpe 1.9492 (+0.066 vs H031b 1.883), MaxDD -9.02% (vs -9.20%), AnnVol 7.43%. Same-weights (51/20/29): Sharpe 1.945 (+0.062). H041a standalone: Sharpe 1.665 vs H020's 1.573 on same window (+0.092). Min-MaxDD blend 64/0/36: MaxDD -8.04%, Sharpe 1.906. EFA/EEM diversification (corr H041a/H037b=0.155 vs H020/H037b correlation was higher) provides genuine portfolio lift. H042 is the new best blend."},{"h":41,"hstr":"H041","status":"CONFIRMED","sharpe":"1.127","cagr":"14.66%","maxdd":"-15.80%","cumul":null,"summary":"(H041a) / MARGINAL (H041b) — H041a (7-asset H020+EFA/EEM): CAGR 14.66%, Sharpe 1.223 (+0.054 vs H020 5-asset baseline), MaxDD -15.80%, OOS Sharpe 1.127 (only 9.2% degradation on...","full":"CONFIRMED (H041a) / MARGINAL (H041b) — H041a (7-asset H020+EFA/EEM): CAGR 14.66%, Sharpe 1.223 (+0.054 vs H020 5-asset baseline), MaxDD -15.80%, OOS Sharpe 1.127 (only 9.2% degradation on fresh IS/OOS split through 2017). H041b (8-asset +VWO): CAGR 15.15%, Sharpe 1.176, MaxDD -23.23%, OOS Sharpe 1.106 (7.9% degradation but MaxDD widens to -23.2% OOS). H020 baseline on same 2003-2026 window: Sharpe 1.169, MaxDD -17.85%. EFA/EEM selected 25.4% of months (H041a), avg intl return when held 1.975%/mo vs 1.810% port avg — genuine contribution when selected. H041a corr to H020 = 0.846 (moderately high, same base universe). H041b corr = 0.796. H041a preferred: better Sharpe and tighter drawdown than H041b; VWO adds breadth but wider MaxDD."},{"h":40,"hstr":"H040","status":"CONFIRMED","sharpe":"1.091","cagr":"14.60%","maxdd":"-33.1%","cumul":null,"summary":"(H040) / REJECTED (H040b) — H040 (15 ETFs): CAGR 14.60%, Sharpe 0.897 (+0.025 vs H026), MaxDD -33.1%, OOS Sharpe 1.091 (OOS improved)","full":"CONFIRMED (H040) / REJECTED (H040b) — H040 (15 ETFs): CAGR 14.60%, Sharpe 0.897 (+0.025 vs H026), MaxDD -33.1%, OOS Sharpe 1.091 (OOS improved). H040b (9 sectors + EFA/EEM): CAGR 13.64%, Sharpe 0.841 (below H026). H040 corr to H026 = 0.963 (near-identical), corr to H020 = 0.466. International ETFs selected 43.4% of months (18.9% of all slots): EFA 22.0%, EWJ 16.1%, VGK 10.5%, EEM 7.9%. Diversification thesis partially confirmed — EM/Europe do get selected when US sectors are weak — but high H026 correlation means no material diversification benefit at portfolio level. H040b's OOS degradation was only -15.3% (excellent) but standalone returns weaker than H026."},{"h":38,"hstr":"H038","status":"NOT CONFIRMED","sharpe":"0.861","cagr":"15.25%","maxdd":"-21.85%","cumul":null,"summary":"as diversifier — Factor ETF rotation (MTUM/QUAL/VLUE/SIZE/USMV/DGRO top-2, same H020 signal)","full":"REJECTED as diversifier — Factor ETF rotation (MTUM/QUAL/VLUE/SIZE/USMV/DGRO top-2, same H020 signal). CAGR 15.25%, Sharpe 1.127, MaxDD -21.85%, AnnVol 13.53% (2013–2026, 144 months). IS Sharpe 1.357 / OOS Sharpe 0.861 (OOS degradation 36.5%). Dominant factors: USMV 47%, QUAL 43%, MTUM 41%. Corr to H020=0.62, H026=0.92, H031=0.85 — too correlated to H026 to diversify. Blending 10% H038 into H031 degrades Sharpe 1.717→1.664. Factor ETFs behave like a noisier H026 with worse risk-adjusted returns. NOT a diversifying layer for H031."},{"h":37,"hstr":"H037","status":"CONFIRMED","sharpe":"0.9523","cagr":null,"maxdd":null,"cumul":null,"summary":"gap < -0.5% filter: Sharpe 1.0207 full (+17%), OOS Sharpe 0.9523 (+27.7%)","full":"CONFIRMED (H037b) — gap < -0.5% filter: Sharpe 1.0207 full (+17%), OOS Sharpe 0.9523 (+27.7%). H037 (-1.0%) marginal. Filtered trades had lower avg return (0.45%) and lower win rate (57.7%) vs kept trades — hypothesis confirmed."},{"h":36,"hstr":"H036","status":"NOT CONFIRMED","sharpe":"-0.006","cagr":"-0.4%","maxdd":"-44%","cumul":null,"summary":"(weak edge, high MaxDD)","full":"REJECTED (weak edge, high MaxDD). Gap < -0.5%: full-period CAGR -0.4%, Sharpe -0.006, MaxDD -44%; gap < -1.0%: CAGR +0.6%, Sharpe 0.12, MaxDD -36%. OOS 2015–2026 is mildly positive for both thresholds but not competitive with H009 IBS (Sharpe 0.83, CAGR 12.0% on same period). High H009 overlap (49-55%). Not worth pursuing standalone; possibly useful as a filter signal within H009."},{"h":35,"hstr":"H035","status":"CONFIRMED","sharpe":"1.546","cagr":"14.22%","maxdd":"-14.68%","cumul":null,"summary":"BTC never selected in 124 evaluated months (0% selection rate)","full":"CONFIRMED (qualified) — BTC never selected in 124 evaluated months (0% selection rate). Inverse-vol rank filters it out completely. H035 Sharpe 1.546 (+0.142 vs H020's 1.404), CAGR 14.22% (-2.08%), MaxDD -14.68% (+5.76pp less deep). Adding BTC to the universe improves Sharpe and reduces drawdown despite BTC never being held — it acts as a signal-diluting 6th asset that lowers position concentration."},{"h":33,"hstr":"H033","status":"NOT CONFIRMED","sharpe":"-0.897","cagr":"-5.41%","maxdd":"-11.73%","cumul":null,"summary":"Both approaches hurt H031","full":"REJECTED — Both approaches hurt H031. Approach A (direct VIX proxy): CAGR -5.41% drag, Sharpe -0.897, MaxDD -11.73% worse. Approach B (rule-based +2%/steep, -15%/panic): CAGR -2.30% drag, Sharpe -0.075. Root cause: (A) VIX spot is not a valid short-vol return proxy — avg VIX move when \"in position\" was +1.49%/month (adversarial), and 22 spike-loss months dominate. (B) Approach B expected value negative: 48%×+2% - 10%×-15% = -0.54%/month. H031 alone (Sharpe 1.763, CAGR 15.18% on 2008–2026 window) already optimal. Short-vol needs actual futures/ETF data (SVXY daily) to model properly."},{"h":32,"hstr":"H032","status":"NOT CONFIRMED","sharpe":"1.560","cagr":"11.01%","maxdd":null,"cumul":null,"summary":"ML overlay detracted","full":"REJECTED — ML overlay detracted. RF accuracy 0.615 (worse than 70.6% base rate), AUC 0.51. OOS H032-RF: CAGR 11.01% vs H031 15.31%, Sharpe 1.560 vs 1.665. Switched 30/109 months; H031 averaged +1.46% in those months (wrong 67% of the time). Top feature: SPY 1m return (46%). Regime features already embedded in H031's component strategies."},{"h":31,"hstr":"H031","status":"CONFIRMED","sharpe":"1.843","cagr":"14.63%","maxdd":"-11.52%","cumul":null,"summary":"Three-way blend H020/H026/H009 56/19/25","full":"CONFIRMED — Three-way blend H020/H026/H009 56/19/25. Sharpe 1.843, CAGR 14.63%, MaxDD -11.52%, AnnVol 7.94%, Calmar 1.270 (273 months, 22.8 yr). Beats H028 two-way blend (Sharpe 1.749) by adding H009's 0.21 corr to H020."},{"h":30,"hstr":"H030","status":"CONFIRMED","sharpe":"70","cagr":"8.80%","maxdd":"-24.2%","cumul":null,"summary":"Taxable-optimal blend","full":"CONFIRMED — Taxable-optimal blend. Pre-tax max-Sharpe: 70%H022/30%H026 (Sharpe 0.801, CAGR 8.80%, MaxDD -24.2%). After-tax optimal: 100%H022 (H026 at 37% STCG destroys returns). H022/H026 corr=0.578. H026 unsuitable for taxable accounts 10, degradation 6.7%; supersedes H016","full":"CONFIRMED — 5-asset OOS Sharpe 1.110, degradation 6.7%; supersedes H016"},{"h":19,"hstr":"H019","status":"CONFIRMED","sharpe":"0.960","cagr":null,"maxdd":null,"cumul":null,"summary":"OOS Sharpe 0.960, degradation only 8.7%","full":"CONFIRMED — OOS Sharpe 0.960, degradation only 8.7%"},{"h":18,"hstr":"H018","status":"CONFIRMED","sharpe":"1.255","cagr":null,"maxdd":"-18.4%","cumul":null,"summary":"Blend 50/50 Sharpe 1.255, MaxDD -18.4%, corr=0.31","full":"CONFIRMED — Blend 50/50 Sharpe 1.255, MaxDD -18.4%, corr=0.31"},{"h":17,"hstr":"H017","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":16,"hstr":"H016","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"GENERALIZES (5/6 universes Sharpe > 0.4)","full":"CONFIRMED — GENERALIZES (5/6 universes Sharpe > 0.4)"},{"h":15,"hstr":"H015","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":14,"hstr":"H014","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":13,"hstr":"H013","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":12,"hstr":"H012","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":11,"hstr":"H011","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":10,"hstr":"H010","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":9,"hstr":"H009","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":8,"hstr":"H008","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"COMPLETE"},{"h":7,"hstr":"H007","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"(mechanical -1.6% CAGR; real data needed for skew correction)","full":"INCONCLUSIVE (mechanical -1.6% CAGR; real data needed for skew correction)"},{"h":6,"hstr":"H006","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"(BIL > TLT) / REJECTED (trails SPY after tax)","full":"CONFIRMED (BIL > TLT) / REJECTED (trails SPY after tax)"},{"h":5,"hstr":"H005","status":"CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"(IS) / REJECTED (OOS)","full":"CONFIRMED (IS) / REJECTED (OOS)"},{"h":4,"hstr":"H004","status":"QUEUED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"PENDING"},{"h":3,"hstr":"H003","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"(directionally confirmed)","full":"INCONCLUSIVE (directionally confirmed)"},{"h":2,"hstr":"H002","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"INCONCLUSIVE"},{"h":1,"hstr":"H001","status":"NOT CONFIRMED","sharpe":null,"cagr":null,"maxdd":null,"cumul":null,"summary":"","full":"REJECTED"}];

const STATUS_ORDER = {'CONFIRMED':0,'PARTIAL':1,'NOT CONFIRMED':2,'QUEUED':3,'FLAGGED':4,'BLOCKED':5,'DEFERRED':6};

let activeFilter = 'ALL';
let activeSort = 'h-desc';
let searchQuery = '';
let expandedH = null;

function getBadgeClass(status) {
  if(status === 'NOT CONFIRMED') return 'badge-NOT_CONFIRMED';
  if(status === 'FLAGGED' || status === 'BLOCKED') return 'badge-FLAGGED';
  return 'badge-' + status;
}

function getFilterGroup(status) {
  if(status === 'FLAGGED' || status === 'BLOCKED') return 'FLAGGED/BLOCKED';
  return status;
}

function parseFloat2(v) {
  if(!v) return null;
  let s = String(v).replace('%','');
  let n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Build filter counts
function getCounts() {
  const counts = {'ALL': DATA.length, 'CONFIRMED':0,'PARTIAL':0,'NOT CONFIRMED':0,'QUEUED':0,'FLAGGED/BLOCKED':0,'DEFERRED':0};
  DATA.forEach(d => {
    const g = getFilterGroup(d.status);
    if(g in counts) counts[g]++;
  });
  return counts;
}

function buildFilterBar() {
  const counts = getCounts();
  const tabs = ['ALL','CONFIRMED','PARTIAL','NOT CONFIRMED','QUEUED','FLAGGED/BLOCKED','DEFERRED'];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';
  tabs.forEach(t => {
    const tab = document.createElement('div');
    tab.className = 'filter-tab' + (activeFilter === t ? ' active' : '');
    tab.dataset.filter = t;
    const label = t === 'FLAGGED/BLOCKED' ? 'FLAGGED/BLOCKED' : t;
    tab.innerHTML = label + ' <span class="tab-count">' + (counts[t]||0) + '</span>';
    tab.addEventListener('click', () => { activeFilter = t; render(); });
    bar.appendChild(tab);
  });
}

function filterData() {
  let d = DATA.slice();
  if(activeFilter !== 'ALL') {
    d = d.filter(e => getFilterGroup(e.status) === activeFilter);
  }
  if(searchQuery) {
    const q = searchQuery.toLowerCase();
    d = d.filter(e =>
      e.hstr.toLowerCase().includes(q) ||
      e.status.toLowerCase().includes(q) ||
      e.summary.toLowerCase().includes(q) ||
      e.full.toLowerCase().includes(q)
    );
  }
  return d;
}

function sortData(d) {
  const s = activeSort;
  return d.sort((a,b) => {
    if(s === 'h-desc') return b.h - a.h;
    if(s === 'h-asc') return a.h - b.h;
    if(s === 'sharpe-desc') {
      const av = parseFloat2(a.sharpe), bv = parseFloat2(b.sharpe);
      if(av === null && bv === null) return 0;
      if(av === null) return 1;
      if(bv === null) return -1;
      return bv - av;
    }
    if(s === 'sharpe-asc') {
      const av = parseFloat2(a.sharpe), bv = parseFloat2(b.sharpe);
      if(av === null && bv === null) return 0;
      if(av === null) return 1;
      if(bv === null) return -1;
      return av - bv;
    }
    if(s === 'maxdd-asc') {
      const av = parseFloat2(a.maxdd), bv = parseFloat2(b.maxdd);
      if(av === null && bv === null) return 0;
      if(av === null) return 1;
      if(bv === null) return -1;
      return bv - av; // less negative = better = higher
    }
    if(s === 'status') {
      const ao = STATUS_ORDER[a.status] ?? 99;
      const bo = STATUS_ORDER[b.status] ?? 99;
      if(ao !== bo) return ao - bo;
      return b.h - a.h;
    }
    return 0;
  });
}

function metricCell(val, type) {
  if(!val) return '<td class="no-data">—</td>';
  let cls = 'neutral';
  const n = parseFloat2(val);
  if(type === 'sharpe' && n !== null) cls = n >= 1.5 ? 'good' : n >= 0.8 ? 'neutral' : 'bad';
  if(type === 'maxdd' && n !== null) cls = n >= -10 ? 'good' : n >= -20 ? 'neutral' : 'bad';
  if(type === 'cagr' && n !== null) cls = n >= 10 ? 'good' : 'neutral';
  const display = val + (type === 'cagr' && !String(val).includes('%') ? '%' : '');
  return '<td><span class="metric ' + cls + '">' + display + '</span></td>';
}

function toggleExpand(h) {
  expandedH = (expandedH === h) ? null : h;
  render();
}

function render() {
  buildFilterBar();
  const filtered = sortData(filterData());
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = filtered.length + ' of ' + DATA.length;

  if(filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  let html = '';
  filtered.forEach(e => {
    const expanded = expandedH === e.h;
    html += '<tr class="data-row" onclick="toggleExpand(' + e.h + ')">';
    html += '<td class="h-num">' + e.hstr + '</td>';
    html += '<td><span class="badge ' + getBadgeClass(e.status) + '">' + e.status + '</span></td>';
    html += metricCell(e.sharpe, 'sharpe');
    html += metricCell(e.cagr, 'cagr');
    html += metricCell(e.maxdd, 'maxdd');
    html += metricCell(e.cumul, 'cumul');
    html += '<td class="summary-text">' + escHtml(e.summary) + '</td>';
    html += '</tr>';
    if(expanded) {
      html += '<tr class="expand-row"><td colspan="7"><div class="expand-panel">';
      html += '<strong style="color:var(--blue)">' + e.hstr + '</strong> &mdash; ';
      html += '<span class="full-text">' + escHtml(e.full) + '</span>';
      html += '</div></td></tr>';
    }
  });
  tbody.innerHTML = html;

  // Update sort indicators
  document.querySelectorAll('th[data-col]').forEach(th => {
    const col = th.dataset.col;
    const isActive = activeSort.startsWith(col);
    th.classList.toggle('sorted', isActive);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Column header sorting
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    const colSortMap = {
      'h': ['h-desc','h-asc'],
      'status': ['status'],
      'sharpe': ['sharpe-desc','sharpe-asc'],
      'cagr': ['sharpe-desc','sharpe-asc'], // reuse
      'maxdd': ['maxdd-asc'],
    };
    const opts = colSortMap[col] || ['h-desc'];
    const cur = opts.indexOf(activeSort);
    activeSort = opts[(cur + 1) % opts.length];
    document.getElementById('sortSelect').value = activeSort;
    render();
  });
});

document.getElementById('sortSelect').addEventListener('change', e => {
  activeSort = e.target.value;
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  expandedH = null;
  render();
});

render();
</script>
